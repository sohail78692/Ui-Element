<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cosmic Dust Input UI Component">
<title>Cosmic Dust Input</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050510;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .cosmic-input-wrapper {
        position: relative;
    }
    .cosmic-input {
        width: 320px;
        padding: 16px 20px;
        font-size: 15px;
        color: #fff;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        outline: none;
        transition: all 0.4s ease;
    }
    .cosmic-input::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }
    .cosmic-input:focus {
        border-color: rgba(139, 92, 246, 0.6);
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
    }
    .star-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        border-radius: 12px;
    }
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        border-radius: 50%;
        opacity: 0;
    }
    .cosmic-input:focus ~ .star-field .star {
        animation: twinkle 1s ease-out forwards;
    }
    @keyframes twinkle {
        0% { opacity: 1; transform: scale(0); }
        100% { opacity: 0; transform: scale(1); }
    }
    .nebula-glow {
        position: absolute;
        inset: -20px;
        background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.15), transparent 70%);
        opacity: 0;
        transition: opacity 0.4s;
        z-index: -1;
    }
    .cosmic-input:focus ~ .nebula-glow {
        opacity: 1;
    }
</style>
</head>
<body>
<div class="cosmic-input-wrapper">
    <input type="text" class="cosmic-input" placeholder="Enter username">
    <div class="star-field"></div>
    <div class="nebula-glow"></div>
</div>
<script>
    document.querySelector('.cosmic-input').addEventListener('focus', function() {
        const field = this.parentElement.querySelector('.star-field');
        field.innerHTML = '';
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 0.5 + 's';
            star.style.background = Math.random() > 0.5 ? '#8b5cf6' : '#fff';
            field.appendChild(star);
        }
    });
</script>
</body>
</html>
