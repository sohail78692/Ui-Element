<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Signal Toggle Switch UI Component">
<title>Signal Toggle Switch</title>
<style>
body { background:#0c0c14; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.toggle-signal {
  position:relative;
  width:70px;
  height:36px;
  cursor:pointer;
}
.toggle-signal input { display:none; }
.toggle-signal .track {
  position:absolute;
  width:100%;height:100%;
  background:#1a1a2e;
  border-radius:18px;
  transition:all 0.3s ease;
}
.toggle-signal .thumb {
  position:absolute;
  top:3px;left:3px;
  width:30px;height:30px;
  background:#444;
  border-radius:50%;
  transition:all 0.3s cubic-bezier(0.68,-0.55,0.265,1.55);
}
.toggle-signal input:checked + .track {
  background:linear-gradient(135deg,#00ff88,#00cc66);
  box-shadow:0 0 20px rgba(0,255,136,0.4);
}
.toggle-signal input:checked + .track .thumb {
  transform:translateX(34px);
  background:#fff;
  box-shadow:0 0 10px rgba(255,255,255,0.5);
}
.toggle-signal .signals {
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:3px;
}
.toggle-signal .signals span {
  width:3px;
  height:12px;
  background:#333;
  border-radius:2px;
  transition:all 0.3s;
}
.toggle-signal .signals span:nth-child(2) { height:18px; }
.toggle-signal .signals span:nth-child(3) { height:8px; }
.toggle-signal input:checked + .track .signals span {
  background:#003322;
}
</style>
</head>
<body>
<label class="toggle-signal">
  <input type="checkbox">
  <div class="track">
    <div class="thumb"></div>
    <div class="signals">
      <span></span><span></span><span></span>
    </div>
  </div>
</label>
</body>
</html>
