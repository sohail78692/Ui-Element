<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Neon Toggle Switch UI Component">
<title>Neon Toggle Switch</title>
<style>
body { background:#08080c; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.toggle-neon {
  position:relative;
  width:64px;
  height:32px;
  cursor:pointer;
}
.toggle-neon input { display:none; }
.toggle-neon .track {
  position:absolute;
  width:100%;height:100%;
  background:#151520;
  border-radius:16px;
  border:2px solid #2a2a3a;
  transition:all 0.3s ease;
}
.toggle-neon .thumb {
  position:absolute;
  top:2px;left:2px;
  width:24px;height:24px;
  background:#444;
  border-radius:50%;
  transition:all 0.3s cubic-bezier(0.68,-0.55,0.265,1.55);
  box-shadow:0 2px 5px rgba(0,0,0,0.3);
}
.toggle-neon input:checked + .track {
  border-color:#ff00ff;
  background:#1a0a1a;
  box-shadow:0 0 20px rgba(255,0,255,0.3),inset 0 0 15px rgba(255,0,255,0.1);
}
.toggle-neon input:checked + .track .thumb {
  transform:translateX(32px);
  background:#ff00ff;
  box-shadow:0 0 15px #ff00ff,0 0 30px rgba(255,0,255,0.5);
}
</style>
</head>
<body>
<label class="toggle-neon">
  <input type="checkbox">
  <div class="track">
    <div class="thumb"></div>
  </div>
</label>
</body>
</html>
