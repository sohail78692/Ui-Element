<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Animated Checkbox UI Component">
<title>Animated Checkbox</title>
<style>
body { background:#0d0d14; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;gap:20px;flex-direction:column; }
.check-anim {
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  color:#aaa;
  font-size:16px;
  transition:color 0.2s;
}
.check-anim:hover { color:#fff; }
.check-anim input { display:none; }
.check-anim .box {
  width:24px;
  height:24px;
  border:2px solid #444;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s;
}
.check-anim input:checked + .box {
  background:#00ffaa;
  border-color:#00ffaa;
}
.check-anim .box svg {
  width:14px;
  height:14px;
  stroke:#000;
  stroke-width:3;
  fill:none;
  opacity:0;
  transform:scale(0);
  transition:all 0.2s;
}
.check-anim input:checked + .box svg {
  opacity:1;
  transform:scale(1);
}
</style>
</head>
<body>
<label class="check-anim">
  <input type="checkbox" checked>
  <span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
  <span>Checked</span>
</label>
<label class="check-anim">
  <input type="checkbox">
  <span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
  <span>Unchecked</span>
</label>
</body>
</html>
