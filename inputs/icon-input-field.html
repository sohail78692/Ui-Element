<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Icon Input UI Component">
<title>Icon Input</title>
<style>
body { background:#0a0a12; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.icon-input {
  position:relative;
  width:260px;
}
.icon-input .icon {
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#555;
  font-size:16px;
}
.icon-input input {
  width:100%;
  padding:14px 14px 14px 42px;
  font-size:15px;
  color:#fff;
  background:#15151f;
  border:2px solid #2a2a3a;
  border-radius:10px;
  outline:none;
  box-sizing:border-box;
  transition:all 0.3s;
}
.icon-input input::placeholder { color:#555; }
.icon-input input:focus {
  border-color:#00ccff;
  box-shadow:0 0 15px rgba(0,204,255,0.2);
}
</style>
</head>
<body>
<div class="icon-input">
  <span class="icon">🔍</span>
  <input type="text" placeholder="Search...">
</div>
</body>
</html>
