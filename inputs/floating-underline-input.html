<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Underline Input UI Component">
<title>Underline Input</title>
<style>
body { background:#0a0a10; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.input-underline {
  position:relative;
  width:260px;
}
.input-underline input {
  width:100%;
  padding:12px 0;
  font-size:16px;
  color:#fff;
  background:transparent;
  border:none;
  border-bottom:2px solid #333;
  outline:none;
  transition:border-color 0.3s;
}
.input-underline input::placeholder { color:#555; }
.input-underline input:focus {
  border-color:#00d4ff;
}
.input-underline .label {
  position:absolute;
  top:12px;left:0;
  font-size:16px;
  color:#666;
  pointer-events:none;
  transition:all 0.3s;
}
.input-underline input:focus ~ .label,
.input-underline input:not(:placeholder-shown) ~ .label {
  top:-8px;
  font-size:12px;
  color:#00d4ff;
}
</style>
</head>
<body>
<div class="input-underline">
  <input type="text" placeholder=" " id="name">
  <label class="label" for="name">Your Name</label>
</div>
</body>
</html>
