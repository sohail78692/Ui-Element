<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Focus Ring Input UI Component">
<title>Focus Ring Input</title>
<style>
body { background:#0c0c14; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.ring-input {
  position:relative;
  width:260px;
}
.ring-input input {
  width:100%;
  padding:14px 18px;
  font-size:15px;
  color:#fff;
  background:#15151f;
  border:2px solid #2a2a3a;
  border-radius:10px;
  outline:none;
  transition:all 0.3s;
}
.ring-input input::placeholder { color:#555; }
.ring-input input:focus {
  border-color:#8b5cf6;
  box-shadow:0 0 0 4px rgba(139,92,246,0.2);
}
</style>
</head>
<body>
<div class="ring-input">
  <input type="text" placeholder="Search...">
</div>
</body>
</html>
