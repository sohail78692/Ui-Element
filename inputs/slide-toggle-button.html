<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Slide Toggle UI Component">
<title>Slide Toggle</title>
<style>
body { background:#0a0a12; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.slide-toggle {
  position:relative;
  width:56px;
  height:28px;
  cursor:pointer;
}
.slide-toggle input { display:none; }
.slide-toggle .track {
  position:absolute;
  width:100%;height:100%;
  background:#222;
  border-radius:14px;
  transition:all 0.3s;
}
.slide-toggle .thumb {
  position:absolute;
  top:2px;left:2px;
  width:24px;height:24px;
  background:#666;
  border-radius:50%;
  transition:all 0.3s;
}
.slide-toggle input:checked + .track {
  background:#00ccff;
}
.slide-toggle input:checked + .track .thumb {
  transform:translateX(28px);
  background:#fff;
}
</style>
</head>
<body>
<label class="slide-toggle">
  <input type="checkbox">
  <div class="track">
    <div class="thumb"></div>
  </div>
</label>
</body>
</html>
