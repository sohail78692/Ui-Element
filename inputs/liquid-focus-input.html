<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Focus Input</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0c0c10;
            font-family: 'IBM Plex Sans', sans-serif;
            flex-direction: column;
            gap: 40px;
        }
        .input-group {
            position: relative;
            width: 100%;
            max-width: 380px;
        }
        .input-field {
            width: 100%;
            padding: 20px 24px;
            padding-top: 28px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 16px;
            outline: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .input-field:focus {
            border-color: rgba(129, 140, 248, 0.6);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.15);
        }
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .input-label {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .input-field:focus + .input-label,
        .input-field:not(:placeholder-shown) + .input-label {
            top: 14px;
            font-size: 10px;
            color: rgba(129, 140, 248, 0.8);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .input-glow {
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.4), rgba(236, 72, 153, 0.2), rgba(129, 140, 248, 0.4));
            filter: blur(10px);
            z-index: -1;
        }
        .input-field:focus ~ .input-glow {
            opacity: 1;
        }
        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .input-field:focus ~ .input-icon {
            color: rgba(129, 140, 248, 0.8);
        }
        .input-icon svg {
            width: 20px;
            height: 20px;
        }
        .input-hint {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            padding-left: 24px;
        }
    </style>
</head>
<body>
    <div class="input-group">
        <input type="text" class="input-field" placeholder=" " id="nameInput">
        <label class="input-label" for="nameInput">Full Name</label>
        <div class="input-glow"></div>
        <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </div>
    <div class="input-group">
        <input type="email" class="input-field" placeholder=" " id="emailInput">
        <label class="input-label" for="emailInput">Email Address</label>
        <div class="input-glow"></div>
        <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
        </div>
    </div>
    <div class="input-group">
        <input type="password" class="input-field" placeholder=" " id="passInput">
        <label class="input-label" for="passInput">Password</label>
        <div class="input-glow"></div>
        <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
        </div>
    </div>
</body>
</html>
