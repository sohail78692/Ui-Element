<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Prism Stack Notification UI Component">
<title>Prism Stack Notification</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0f1a;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .prism-notification {
        position: relative;
        width: 360px;
        padding: 20px 24px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
    }
    .prism-notification::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #f43f5e, #8b5cf6, #06b6d4);
    }
    .notification-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
    }
    .notification-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #f43f5e, #8b5cf6);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .notification-icon svg {
        width: 20px;
        height: 20px;
        color: #fff;
    }
    .notification-title {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
    }
    .notification-time {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
    }
    .notification-body {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.5;
    }
    .prism-shine {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        animation: shine 3s ease-in-out infinite;
    }
    @keyframes shine {
        0%, 100% { left: -100%; }
        50% { left: 100%; }
    }
</style>
</head>
<body>
<div class="prism-notification">
    <div class="prism-shine"></div>
    <div class="notification-header">
        <div class="notification-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </div>
        <div>
            <div class="notification-title">New Update Available</div>
            <div class="notification-time">Just now</div>
        </div>
    </div>
    <p class="notification-body">A new version of the app is ready to download with improved performance and new features.</p>
</div>
</body>
</html>
