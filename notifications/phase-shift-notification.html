<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase Shift Notification</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            font-family: 'Space Mono', monospace;
            flex-direction: column;
            gap: 20px;
        }
        .trigger-btn {
            padding: 14px 30px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: #00d4ff;
            background: transparent;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .trigger-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }
        .phase-notification {
            position: relative;
            width: 360px;
            padding: 18px 20px;
            background: rgba(10, 20, 30, 0.95);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 8px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .phase-notification.show {
            transform: translateX(0);
            opacity: 1;
        }
        .phase-notification.hide {
            transform: translateX(120%);
            opacity: 0;
        }
        .phase-notification::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #00d4ff, #00ffcc, #00d4ff);
            background-size: 200% 200%;
            animation: phaseBar 2s linear infinite;
        }
        @keyframes phaseBar {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .notify-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .notify-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .phase-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
            animation: phasePulse 1.5s infinite;
        }
        .phase-indicator.warning {
            background: #ffaa00;
            box-shadow: 0 0 10px #ffaa00;
        }
        .phase-indicator.error {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }
        .phase-indicator.success {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        @keyframes phasePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .notify-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #ffffff;
        }
        .notify-content {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .notify-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
        }
        .notify-action {
            color: #00d4ff;
            cursor: pointer;
            transition: color 0.2s;
        }
        .notify-action:hover {
            color: #ffffff;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
            animation: scanLine 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scanLine {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .phase-distortion {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.05), transparent);
            animation: phaseDistort 6s infinite;
            pointer-events: none;
        }
        @keyframes phaseDistort {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }
        .time-remaining {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .time-dots {
            display: inline-flex;
            gap: 2px;
        }
        .dot {
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: dotPulse 1s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <button class="trigger-btn" id="triggerNotify">GENERATE PHASE NOTIFICATION</button>
    <div class="notification-container" id="notifyContainer"></div>
    <script>
        const container = document.getElementById('notifyContainer');
        const triggerBtn = document.getElementById('triggerNotify');
        const types = ['info', 'warning', 'error', 'success'];
        const colors = {
            info: { ind: '', warn: '', err: '', suc: '' },
            warning: { ind: 'warning', warn: 'warning', err: '', suc: '' },
            error: { ind: 'error', warn: '', err: '', suc: '' },
            success: { ind: 'success', warn: '', err: '', suc: '' }
        };
        const messages = [
            { title: 'PHASE DRIFT DETECTED', content: 'Temporal anomaly detected in sector 7. Initiating recalibration sequence.', type: 'warning' },
            { title: 'QUANTUM SYNC COMPLETE', content: 'Neural link established. Connection stable at 99.7% efficiency.', type: 'success' },
            { title: 'SYSTEM ALERT', content: 'Core temperature approaching threshold. Monitoring systems engaged.', type: 'error' },
            { title: 'DATA STREAM ACTIVE', content: 'Incoming transmission from satellite network. Decoding data packets.', type: 'info' },
            { title: 'SHIELD RECHARGED', content: 'Deflector arrays at maximum capacity. All systems nominal.', type: 'success' },
            { title: 'ANOMALY WARNING', content: 'Unidentified energy signature detected. Scanners active.', type: 'warning' }
        ];
        function createNotification(msg, index) {
            const notif = document.createElement('div');
            notif.className = 'phase-notification';
            notif.innerHTML = `
                <div class="scan-line"></div>
                <div class="phase-distortion"></div>
                <div class="notify-header">
                    <div class="notify-title-row">
                        <div class="phase-indicator ${msg.type === 'warning' ? 'warning' : msg.type === 'error' ? 'error' : msg.type === 'success' ? 'success' : ''}"></div>
                        <span class="notify-title">${msg.title}</span>
                    </div>
                    <button class="close-btn">&times;</button>
                </div>
                <div class="notify-content">${msg.content}</div>
                <div class="notify-meta">
                    <span>${new Date().toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute: '2-digit'})}</span>
                    <span class="time-remaining">
                        expires in
                        <span class="time-dots">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </span>
                    </span>
                </div>
            `;
            container.appendChild(notif);
            setTimeout(() => notif.classList.add('show'), index * 100);
            const closeBtn = notif.querySelector('.close-btn');
            closeBtn.addEventListener('click', () => {
                notif.classList.remove('show');
                notif.classList.add('hide');
                setTimeout(() => notif.remove(), 400);
            });
            setTimeout(() => {
                if (notif.parentNode) {
                    notif.classList.remove('show');
                    notif.classList.add('hide');
                    setTimeout(() => notif.remove(), 400);
                }
            }, 8000);
        }
        triggerBtn.addEventListener('click', () => {
            for (let i = 0; i < 3; i++) {
                const msg = messages[Math.floor(Math.random() * messages.length)];
                createNotification(msg, i);
            }
        });
    </script>
</body>
</html>
