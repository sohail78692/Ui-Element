<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Toast Notification</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #08080c;
            font-family: 'DM Sans', sans-serif;
            flex-direction: column;
            gap: 16px;
            padding: 40px;
        }
        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: rgba(15, 15, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            min-width: 320px;
            position: relative;
            overflow: hidden;
            animation: toast-slide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            backdrop-filter: blur(20px);
        }
        .toast.removing {
            animation: toast-exit 0.4s ease forwards;
        }
        @keyframes toast-slide {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toast-exit {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
        .toast-aurora {
            position: absolute;
            inset: 0;
            opacity: 0.4;
            background: linear-gradient(135deg, 
                rgba(34, 211, 238, 0.3) 0%, 
                rgba(168, 85, 247, 0.2) 50%, 
                rgba(34, 211, 238, 0.1) 100%);
            filter: blur(20px);
        }
        .toast-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .toast-icon svg {
            width: 14px;
            height: 14px;
        }
        .toast-icon.success {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .toast-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .toast-icon.info {
            background: rgba(34, 211, 238, 0.2);
            color: #22d3ee;
        }
        .toast-icon.warning {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .toast-content {
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .toast-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }
        .toast-message {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }
        .toast-close {
            width: 24px;
            height: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            position: relative;
            z-index: 1;
        }
        .toast-close:hover {
            color: rgba(255, 255, 255, 0.7);
        }
        .toast-close::before,
        .toast-close::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 1.5px;
            background: currentColor;
        }
        .toast-close::before { transform: rotate(45deg); }
        .toast-close::after { transform: rotate(-45deg); }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-btn {
            padding: 12px 24px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <div class="controls">
        <button class="control-btn" onclick="showToast('success')">Success</button>
        <button class="control-btn" onclick="showToast('error')">Error</button>
        <button class="control-btn" onclick="showToast('info')">Info</button>
        <button class="control-btn" onclick="showToast('warning')">Warning</button>
    </div>
    <script>
        const container = document.getElementById('toastContainer');
        const icons = {
            success: '<path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" fill="none"/>',
            error: '<path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" fill="none"/>',
            info: '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" fill="none"/>',
            warning: '<path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2" fill="none"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="2" fill="none"/>'
        };
        const messages = {
            success: { title: 'Success', message: 'Your changes have been saved' },
            error: { title: 'Error', message: 'Failed to connect to server' },
            info: { title: 'Update Available', message: 'A new version is ready to download' },
            warning: { title: 'Warning', message: 'Your session will expire soon' }
        };
        function showToast(type) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-aurora"></div>
                <div class="toast-icon ${type}">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${messages[type].title}</div>
                    <div class="toast-message">${messages[type].message}</div>
                </div>
                <button class="toast-close" onclick="removeToast(this.parentElement)"></button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                removeToast(toast);
            }, 5000);
        }
        function removeToast(toast) {
            if (!toast || toast.classList.contains('removing')) return;
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 400);
        }
    </script>
</body>
</html>
