<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0c;
            font-family: 'Space Grotesk', sans-serif;
            padding: 40px 20px;
        }
        .gallery-container {
            width: 100%;
            max-width: 1100px;
        }
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .gallery-title {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .gallery-title span {
            background: linear-gradient(135deg, #f472b6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gallery-nav {
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: rgba(244, 114, 182, 0.2);
            border-color: rgba(244, 114, 182, 0.5);
        }
        .nav-btn::before {
            content: '';
            width: 10px;
            height: 10px;
            border-right: 2px solid rgba(255, 255, 255, 0.6);
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
        }
        .nav-btn.prev::before {
            transform: rotate(135deg);
            margin-left: 4px;
        }
        .nav-btn.next::before {
            transform: rotate(-45deg);
            margin-right: 4px;
        }
        .gallery-track {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 20px 0;
            scrollbar-width: none;
        }
        .gallery-track::-webkit-scrollbar {
            display: none;
        }
        .gallery-card {
            min-width: 320px;
            height: 420px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(255,255,255,0.005));
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .gallery-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(244, 114, 182, 0.3) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .gallery-card:hover::before {
            opacity: 1;
        }
        .gallery-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(244, 114, 182, 0.15);
            border-color: rgba(244, 114, 182, 0.3);
        }
        .card-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
        }
        .gallery-card:hover .card-image {
            transform: scale(1.1);
        }
        .card-img-1 { background: linear-gradient(135deg, #1a1a2e, #16213e); }
        .card-img-2 { background: linear-gradient(135deg, #2d1b4e, #1a1a2e); }
        .card-img-3 { background: linear-gradient(135deg, #1b2838, #0f172a); }
        .card-img-4 { background: linear-gradient(135deg, #2e1061, #1e1b4b); }
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
        }
        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
        }
        .card-tag {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(244, 114, 182, 0.2);
            border: 1px solid rgba(244, 114, 182, 0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #f472b6;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card-title {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .card-meta span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-meta span::before {
            content: '';
            width: 6px;
            height: 6px;
            background: rgba(244, 114, 182, 0.6);
            border-radius: 50%;
        }
        .spotlight {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 100;
            transition: all 0.3s ease;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="spotlight" id="spotlight"></div>
    <div class="gallery-container">
        <div class="gallery-header">
            <h2 class="gallery-title">Featured <span>Visual</span></h2>
            <div class="gallery-nav">
                <button class="nav-btn prev" id="prevBtn"></button>
                <button class="nav-btn next" id="nextBtn"></button>
            </div>
        </div>
        <div class="gallery-track" id="galleryTrack">
            <div class="gallery-card">
                <div class="card-image card-img-1"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <span class="card-tag">Abstract</span>
                    <h3 class="card-title">Neon Dreams</h3>
                    <div class="card-meta">
                        <span>24 media</span>
                        <span>2.4k views</span>
                    </div>
                </div>
            </div>
            <div class="gallery-card">
                <div class="card-image card-img-2"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <span class="card-tag">Digital</span>
                    <h3 class="card-title">Cyber Pulse</h3>
                    <div class="card-meta">
                        <span>18 media</span>
                        <span>1.8k views</span>
                    </div>
                </div>
            </div>
            <div class="gallery-card">
                <div class="card-image card-img-3"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <span class="card-tag">3D Art</span>
                    <h3 class="card-title">Depth Matrix</h3>
                    <div class="card-meta">
                        <span>32 media</span>
                        <span>3.1k views</span>
                    </div>
                </div>
            </div>
            <div class="gallery-card">
                <div class="card-image card-img-4"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <span class="card-tag">Motion</span>
                    <h3 class="card-title">Liquid Flow</h3>
                    <div class="card-meta">
                        <span>12 media</span>
                        <span>956 views</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const track = document.getElementById('galleryTrack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const spotlight = document.getElementById('spotlight');
        const cardWidth = 344;
        prevBtn.addEventListener('click', () => {
            track.scrollBy({ left: -cardWidth, behavior: 'smooth' });
        });
        nextBtn.addEventListener('click', () => {
            track.scrollBy({ left: cardWidth, behavior: 'smooth' });
        });
        document.addEventListener('mousemove', (e) => {
            spotlight.style.left = e.clientX - 150 + 'px';
            spotlight.style.top = e.clientY - 150 + 'px';
            spotlight.style.opacity = 1;
        });
        let lastMousePos = 0;
        track.addEventListener('mousemove', (e) => {
            const rect = track.getBoundingClientRect();
            const x = e.clientX - rect.left;
            lastMousePos = x;
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                track.scrollBy({ left: -cardWidth, behavior: 'smooth' });
            } else if (e.key === 'ArrowRight') {
                track.scrollBy({ left: cardWidth, behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
