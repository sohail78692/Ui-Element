<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes elastic-scale {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.05); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes gradient-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .elastic-icon {
      animation: elastic-scale 1s ease-in-out infinite;
    }
    .bounce-icon {
      animation: bounce 1s ease-in-out infinite;
    }
    .ring {
      animation: pulse-ring 2s ease-out infinite;
    }
    .gradient-spin {
      animation: gradient-spin 8s linear infinite;
    }
    .card-hover {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-5px) scale(1.02);
    }
    .drop-active {
      border-color: #f59e0b !important;
      background: rgba(245,158,11,0.1) !important;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-yellow-950/30 to-gray-900 min-h-screen flex items-center justify-center p-8">

  <div class="w-full max-w-xl">
    <h2 class="text-3xl font-bold text-white mb-2 text-center">Bounce Upload</h2>
    <p class="text-gray-400 text-center mb-8">Playful bouncing animation upload</p>

    <div class="bg-gray-900/80 border border-yellow-500/30 rounded-3xl p-12 cursor-pointer transition-all hover:border-yellow-500/60 hover:shadow-[0_0_30px_rgba(245,158,11,0.2)]" id="dropzone">
      <div class="relative flex flex-col items-center">
        <div class="relative mb-6">
          <div class="ring absolute inset-0 rounded-full border-2 border-yellow-500/30"></div>
          <div class="ring absolute inset-0 rounded-full border-2 border-yellow-400/20" style="animation-delay: 0.5s"></div>
          <div class="elastic-icon w-20 h-20 rounded-2xl bg-gradient-to-br from-yellow-500 to-amber-600 flex items-center justify-center">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
          </div>
        </div>
        
        <h3 class="text-xl font-semibold text-white mb-2">Drop files here</h3>
        <p class="text-gray-400 text-sm mb-4">Click or drag to upload</p>
        
        <div class="flex items-center gap-2">
          <div class="bounce-icon w-8 h-8 rounded-lg bg-yellow-500/20 flex items-center justify-center">
            <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/></svg>
          </div>
          <span class="text-sm text-gray-500">Any files accepted</span>
        </div>
      </div>
      
      <input type="file" id="fileInput" class="hidden" multiple>
    </div>

    <div id="fileList" class="mt-6 space-y-3"></div>

    <button id="uploadBtn" class="hidden w-full mt-6 py-4 rounded-2xl bg-gradient-to-r from-yellow-500 to-amber-600 font-semibold transition-all hover:scale-[1.02]">
      <span class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        Upload Files
      </span>
    </button>

    <div class="mt-12 grid grid-cols-3 gap-4">
      <div class="card-hover bg-gray-800/60 border border-white/10 rounded-2xl p-5 text-center cursor-pointer">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-yellow-500/10 flex items-center justify-center">
          <svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <p class="text-white font-medium text-sm">Docs</p>
        <p class="text-xs text-gray-500 mt-1">15 files</p>
      </div>

      <div class="card-hover bg-gray-800/60 border border-white/10 rounded-2xl p-5 text-center cursor-pointer">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-amber-500/10 flex items-center justify-center">
          <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <p class="text-white font-medium text-sm">Media</p>
        <p class="text-xs text-gray-500 mt-1">8 files</p>
      </div>

      <div class="card-hover bg-gray-800/60 border border-white/10 rounded-2xl p-5 text-center cursor-pointer">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-orange-500/10 flex items-center justify-center">
          <svg class="w-6 h-6 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
        </div>
        <p class="text-white font-medium text-sm">Archives</p>
        <p class="text-xs text-gray-500 mt-1">3 files</p>
      </div>
    </div>

  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');

    dropzone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.add('drop-active');
      });
    });

    ['dragleave', 'drop'].forEach(event => {
      dropzone.addEventListener(event, () => {
        dropzone.classList.remove('drop-active');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      [...files].forEach((file, i) => setTimeout(() => addFile(file), i * 100));
      uploadBtn.classList.remove('hidden');
    }

    function addFile(file) {
      const div = document.createElement('div');
      div.className = 'card-hover bg-gray-800/60 border border-white/10 rounded-xl p-4 flex items-center gap-4';
      div.innerHTML = `
        <div class="w-10 h-10 rounded-xl bg-yellow-500/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-medium truncate">${file.name}</p>
          <p class="text-xs text-gray-500">${(file.size / 1024).toFixed(1)} KB</p>
        </div>
        <button class="text-gray-500 hover:text-red-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      `;
      fileList.appendChild(div);
    }
  </script>

</body>
</html>
