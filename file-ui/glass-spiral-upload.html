<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spiral {
      0% { transform: rotate(0deg) scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: rotate(360deg) scale(1.2); opacity: 0; }
    }
    @keyframes ripple-expand {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    @keyframes float-elastic {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-15px); }
      50% { transform: translateY(0); }
      70% { transform: translateY(-5px); }
    }
    @keyframes glass-shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .spiral {
      animation: spiral 2s ease-out infinite;
    }
    .spiral:nth-child(2) { animation-delay: -0.5s; }
    .spiral:nth-child(3) { animation-delay: -1s; }
    .spiral:nth-child(4) { animation-delay: -1.5s; }
    .ripple {
      animation: ripple-expand 2s ease-out infinite;
    }
    .elastic-float {
      animation: float-elastic 2s ease-in-out infinite;
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .shimmer-effect {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      background-size: 200% 100%;
      animation: glass-shimmer 3s infinite;
    }
    .drop-area {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .drop-area:hover {
      transform: scale(1.02);
    }
    .drop-area.dragging {
      transform: scale(1.05);
      border-color: rgba(236,72,153,0.8);
      box-shadow: 0 0 40px rgba(236,72,153,0.3);
    }
  </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-8">

  <div class="w-full max-w-xl">
    <h2 class="text-3xl font-bold text-white mb-2 text-center">Glass Spiral Upload</h2>
    <p class="text-gray-400 text-center mb-8">Elegant glassmorphism upload zone</p>

    <div class="drop-area glass-card rounded-3xl p-16 cursor-pointer border-2 border-transparent" id="dropzone">
      <div class="absolute inset-0 overflow-hidden rounded-3xl pointer-events-none">
        <div class="spiral absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 border border-pink-500/30 rounded-full"></div>
        <div class="spiral absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-56 h-56 border border-rose-500/20 rounded-full"></div>
        <div class="spiral absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 border border-pink-500/10 rounded-full"></div>
      </div>
      
      <div class="ripple absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 rounded-full border-2 border-pink-500/40"></div>
      
      <div class="relative z-10 text-center">
        <div class="elastic-float inline-flex items-center justify-center w-24 h-24 rounded-2xl bg-gradient-to-br from-pink-500/30 to-rose-500/30 mb-6">
          <svg class="w-12 h-12 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        
        <h3 class="text-xl font-semibold text-white mb-2">Drop files here</h3>
        <p class="text-gray-400 text-sm mb-4">or click to select files</p>
        
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10">
          <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
          <span class="text-xs text-gray-400">Ready</span>
        </div>
      </div>
      
      <input type="file" id="fileInput" class="hidden" multiple>
    </div>

    <div id="fileList" class="mt-6 space-y-3"></div>

    <button id="uploadBtn" class="hidden w-full mt-6 py-4 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 font-semibold transition-all hover:opacity-90">
      <span class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        Upload Files
      </span>
    </button>

    <div class="mt-12 grid grid-cols-2 gap-4">
      <div class="glass-card rounded-2xl p-6">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-pink-500/20 flex items-center justify-center">
            <svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <span class="text-white font-medium">Images</span>
        </div>
        <p class="text-xs text-gray-500">PNG, JPG, GIF</p>
      </div>

      <div class="glass-card rounded-2xl p-6">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-rose-500/20 flex items-center justify-center">
            <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <span class="text-white font-medium">Documents</span>
        </div>
        <p class="text-xs text-gray-500">PDF, DOC, TXT</p>
      </div>
    </div>

  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');

    dropzone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragging');
      });
    });

    ['dragleave', 'drop'].forEach(event => {
      dropzone.addEventListener(event, () => {
        dropzone.classList.remove('dragging');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      [...files].forEach((file, i) => setTimeout(() => addFile(file), i * 100));
      uploadBtn.classList.remove('hidden');
    }

    function addFile(file) {
      const div = document.createElement('div');
      div.className = 'glass-card rounded-xl p-4 flex items-center gap-4';
      div.innerHTML = `
        <div class="w-10 h-10 rounded-lg bg-pink-500/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-pink-400" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-medium truncate">${file.name}</p>
          <p class="text-xs text-gray-500">${(file.size / 1024).toFixed(1)} KB</p>
        </div>
        <button class="text-gray-500 hover:text-pink-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      `;
      fileList.appendChild(div);
    }
  </script>

</body>
</html>
