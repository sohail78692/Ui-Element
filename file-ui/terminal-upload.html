<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes grid-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    @keyframes typing {
      0%, 100% { width: 0; }
      50% { width: 100%; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .grid-bg {
      background-image: 
        linear-gradient(rgba(34,197,94,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: grid-pulse 3s ease-in-out infinite;
    }
    .typing-cursor::after {
      content: '|';
      animation: blink 0.7s infinite;
    }
    .scan-beam {
      animation: scan 2s linear infinite;
    }
    .terminal-line {
      opacity: 0;
      animation: fade-in 0.3s forwards;
    }
    @keyframes fade-in {
      to { opacity: 1; }
    }
    .progress-bar {
      background: linear-gradient(90deg, #22c55e 0%, #4ade80 50%, #22c55e 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-8">

  <div class="w-full max-w-xl">
    <h2 class="text-3xl font-bold text-white mb-2 text-center">Terminal Upload</h2>
    <p class="text-gray-400 text-center mb-8">Command-line style file upload</p>

    <div class="bg-gray-950 border border-green-500/30 rounded-lg overflow-hidden">
      <div class="bg-green-900/30 px-4 py-2 flex items-center gap-2 border-b border-green-500/20">
        <div class="flex gap-1.5">
          <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
        </div>
        <span class="text-green-400/60 text-sm font-mono ml-2">upload@terminal:~$</span>
      </div>
      
      <div class="p-6 font-mono text-sm">
        <div class="text-green-400 mb-2">
          <span class="text-blue-400">$</span> drop files to upload
        </div>
        
        <div id="terminal" class="space-y-1 min-h-[200px]">
          <div class="text-green-500/50">Waiting for input...</div>
        </div>
        
        <div id="progressArea" class="hidden mt-4 space-y-2">
          <div class="text-green-400 text-xs" id="statusText">Uploading: file.txt</div>
          <div class="h-2 bg-gray-800 rounded overflow-hidden">
            <div class="progress-bar h-full rounded" style="width: 0%"></div>
          </div>
          <div class="text-green-500/50 text-xs" id="percentText">0%</div>
        </div>
      </div>
    </div>

    <div class="mt-12 grid grid-cols-3 gap-4">
      <div class="bg-gray-900/60 border border-white/10 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-green-400">1.2GB</div>
        <p class="text-xs text-gray-500 mt-1">Uploaded</p>
      </div>
      <div class="bg-gray-900/60 border border-white/10 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-blue-400">24</div>
        <p class="text-xs text-gray-500 mt-1">Files</p>
      </div>
      <div class="bg-gray-900/60 border border-white/10 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-purple-400">3</div>
        <p class="text-xs text-gray-500 mt-1">Pending</p>
      </div>
    </div>

    <div class="mt-8">
      <h3 class="text-white font-medium mb-4">Quick Commands</h3>
      <div class="flex flex-wrap gap-2">
        <button class="px-3 py-1.5 bg-green-900/30 border border-green-500/30 rounded text-green-400 text-sm font-mono hover:bg-green-900/50 transition-all">
          ls -la
        </button>
        <button class="px-3 py-1.5 bg-gray-800/50 border border-white/10 rounded text-gray-300 text-sm font-mono hover:bg-gray-800 transition-all">
          cd uploads/
        </button>
        <button class="px-3 py-1.5 bg-gray-800/50 border border-white/10 rounded text-gray-300 text-sm font-mono hover:bg-gray-800 transition-all">
          rm -rf
        </button>
        <button class="px-3 py-1.5 bg-gray-800/50 border border-white/10 rounded text-gray-300 text-sm font-mono hover:bg-gray-800 transition-all">
          chmod +x
        </button>
      </div>
    </div>

  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const progressArea = document.getElementById('progressArea');
    const statusText = document.getElementById('statusText');
    const percentText = document.getElementById('percentText');
    const progressBar = progressArea.querySelector('.progress-bar');

    document.body.addEventListener('dragover', (e) => {
      e.preventDefault();
      addLine('$ Detecting file drop...', 'text-yellow-400');
    });

    document.body.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      [...files].forEach((file, index) => {
        setTimeout(() => uploadFile(file), index * 500);
      });
    }

    function uploadFile(file) {
      addLine(`$ Processing: ${file.name}`, 'text-green-400');
      progressArea.classList.remove('hidden');
      statusText.textContent = `Uploading: ${file.name}`;
      
      let percent = 0;
      const interval = setInterval(() => {
        percent += Math.random() * 15;
        if (percent >= 100) {
          percent = 100;
          clearInterval(interval);
          addLine(`$ Upload complete: ${file.name}`, 'text-blue-400');
          addLine('$ Ready for next operation...', 'text-green-500/50');
          setTimeout(() => progressArea.classList.add('hidden'), 1000);
        }
        progressBar.style.width = percent + '%';
        percentText.textContent = Math.floor(percent) + '%';
      }, 100);
    }

    function addLine(text, colorClass) {
      const line = document.createElement('div');
      line.className = `terminal-line ${colorClass}`;
      line.textContent = text;
      terminal.appendChild(line);
    }
  </script>

</body>
</html>
