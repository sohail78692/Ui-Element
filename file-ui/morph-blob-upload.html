<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes morph {
      0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
    }
    @keyframes blob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }
    @keyframes float-3d {
      0%, 100% { transform: translateY(0) rotateX(0); }
      50% { transform: translateY(-10px) rotateX(5deg); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -20; }
    }
    .morph-bg {
      animation: morph 8s ease-in-out infinite;
    }
    .blob {
      animation: blob 10s ease-in-out infinite;
    }
    .float-3d {
      animation: float-3d 4s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    .pulse-ring {
      animation: pulse-ring 2s ease-out infinite;
    }
    .dash-flow {
      stroke-dasharray: 8 4;
      animation: dash-flow 1s linear infinite;
    }
    .cube-container {
      perspective: 600px;
    }
    .file-cube {
      transform-style: preserve-3d;
      transform: rotateX(-20deg) rotateY(25deg);
    }
    .cube-face {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid rgba(251,191,36,0.5);
      background: rgba(251,191,36,0.1);
    }
    .cube-face.front  { transform: translateZ(30px); }
    .cube-face.back   { transform: rotateY(180deg) translateZ(30px); }
    .cube-face.right  { transform: rotateY(90deg) translateZ(30px); }
    .cube-face.left   { transform: rotateY(-90deg) translateZ(30px); }
    .cube-face.top    { transform: rotateX(90deg) translateZ(30px); }
    .cube-face.bottom { transform: rotateX(-90deg) translateZ(30px); }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-8">

  <div class="w-full max-w-xl">
    <h2 class="text-3xl font-bold text-white mb-2 text-center">Morph Upload</h2>
    <p class="text-gray-400 text-center mb-8">Organic blob-shaped dropzone</p>

    <div class="relative p-16 flex items-center justify-center">
      <div class="morph-bg absolute inset-8 bg-gradient-to-br from-amber-500/20 via-orange-500/10 to-yellow-500/20"></div>
      <div class="blob absolute w-32 h-32 bg-amber-500/20 rounded-full blur-3xl"></div>
      <div class="blob absolute w-24 h-24 bg-yellow-500/20 rounded-full blur-2xl top-10 right-10" style="animation-delay: -2s"></div>
      
      <div class="upload-zone relative z-10 cursor-pointer" id="dropzone">
        <div class="pulse-ring absolute inset-0 rounded-full border-2 border-amber-500/30"></div>
        
        <div class="relative bg-gray-900/90 backdrop-blur rounded-[2rem] p-12 border border-amber-500/30 hover:border-amber-500/60 transition-all group">
          <svg class="w-16 h-16 text-amber-400 mx-auto mb-4 float-3d" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
          
          <h3 class="text-xl font-semibold text-white text-center mb-2">Drop files here</h3>
          <p class="text-gray-400 text-center text-sm">or click to browse</p>
          
          <div class="flex items-center justify-center gap-2 mt-4">
            <svg class="w-4 h-4 text-amber-400/60" fill="currentColor" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
            <span class="text-xs text-gray-500">Any file type</span>
          </div>
        </div>
      </div>
      
      <input type="file" id="fileInput" class="hidden" multiple>
    </div>

    <div id="fileList" class="mt-6 space-y-3"></div>

    <button id="uploadBtn" class="hidden w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 font-semibold transition-all">
      <span class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        Upload Files
      </span>
    </button>

    <div class="mt-12">
      <h3 class="text-white font-medium mb-4">Variations</h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-gray-800/50 rounded-2xl p-6 cursor-pointer hover:bg-gray-800 transition-all group">
          <div class="cube-container w-full flex items-center justify-center h-20 mb-3">
            <div class="file-cube">
              <div class="cube-face front"></div>
              <div class="cube-face back"></div>
              <div class="cube-face right"></div>
              <div class="cube-face left"></div>
              <div class="cube-face top"></div>
              <div class="cube-face bottom"></div>
            </div>
          </div>
          <p class="text-sm text-gray-400 text-center">3D Cube</p>
        </div>

        <div class="bg-gray-800/50 rounded-2xl p-6 cursor-pointer hover:bg-gray-800 transition-all group">
          <div class="w-full flex items-center justify-center h-20 mb-3">
            <svg class="w-12 h-12 text-amber-400 dash-flow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <p class="text-sm text-gray-400 text-center">Dashed Border</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');

    dropzone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.querySelector('.group').classList.add('border-amber-500', 'bg-amber-500/10');
      });
    });

    ['dragleave', 'drop'].forEach(event => {
      dropzone.addEventListener(event, () => {
        dropzone.querySelector('.group').classList.remove('border-amber-500', 'bg-amber-500/10');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      [...files].forEach((file, i) => setTimeout(() => addFile(file), i * 100));
      uploadBtn.classList.remove('hidden');
    }

    function addFile(file) {
      const div = document.createElement('div');
      div.className = 'bg-gray-800/80 border border-amber-500/20 rounded-xl p-4 flex items-center gap-4';
      div.innerHTML = `
        <div class="w-10 h-10 rounded-lg bg-amber-500/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-medium truncate">${file.name}</p>
          <p class="text-xs text-gray-500">${(file.size / 1024).toFixed(1)} KB</p>
        </div>
        <button class="text-gray-500 hover:text-red-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      `;
      fileList.appendChild(div);
    }
  </script>

</body>
</html>
