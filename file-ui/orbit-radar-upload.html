<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(80px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(80px) rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    @keyframes scan {
      0% { left: 0; }
      100% { left: 100%; }
    }
    @keyframes radar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orbit-item {
      animation: orbit 4s linear infinite;
    }
    .radar-sweep {
      animation: radar 3s linear infinite;
      transform-origin: center;
    }
    .folder-item {
      transition: all 0.3s ease;
    }
    .folder-item:hover {
      transform: translateX(8px);
    }
    .scan-line {
      animation: scan 2s ease-in-out infinite;
    }
    .upload-btn {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }
  </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-8">

  <div class="w-full max-w-2xl">
    <h2 class="text-3xl font-bold text-white mb-2 text-center">Orbit Upload</h2>
    <p class="text-gray-400 text-center mb-8">Satellite orbit-style file upload</p>

    <div class="relative bg-gray-900/80 border border-indigo-500/30 rounded-3xl p-16 overflow-hidden">
      <div class="radar-sweep absolute w-64 h-64 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
        <svg viewBox="0 0 200 200" class="w-full h-full">
          <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
          <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(99,102,241,0.15)" stroke-width="1"/>
          <circle cx="100" cy="100" r="30" fill="none" stroke="rgba(99,102,241,0.1)" stroke-width="1"/>
          <line x1="100" y1="10" x2="100" y2="190" stroke="rgba(99,102,241,0.1)" stroke-width="1"/>
          <line x1="10" y1="100" x2="190" y2="100" stroke="rgba(99,102,241,0.1)" stroke-width="1"/>
          <path d="M100 100 L100 10 A90 90 0 0 1 190 100 Z" fill="url(#radarGradient)" opacity="0.3"/>
          <defs>
            <linearGradient id="radarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="transparent"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <div class="orbit-center relative w-32 h-32 mx-auto mb-8">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-20 h-20 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
          </div>
        </div>
        <div class="orbit-item absolute w-3 h-3 bg-indigo-400 rounded-full top-0 left-1/2 -translate-x-1/2 shadow-[0_0_10px_rgba(99,102,241,0.8)]"></div>
        <div class="orbit-item absolute w-3 h-3 bg-purple-400 rounded-full top-0 left-1/2 -translate-x-1/2 shadow-[0_0_10px_rgba(168,85,247,0.8)]" style="animation-delay: -1s"></div>
        <div class="orbit-item absolute w-3 h-3 bg-violet-400 rounded-full top-0 left-1/2 -translate-x-1/2 shadow-[0_0_10px_rgba(167,139,250,0.8)]" style="animation-delay: -2s"></div>
      </div>

      <div class="relative z-10 text-center">
        <h3 class="text-xl font-semibold text-white mb-2">Drop files to upload</h3>
        <p class="text-gray-400 text-sm mb-6">Files will be synced to your cloud</p>
        
        <button id="uploadBtn" class="upload-btn px-8 py-3 rounded-xl font-medium text-white hover:opacity-90 transition-all">
          <span class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
            Browse Files
          </span>
        </button>
        <input type="file" id="fileInput" class="hidden" multiple>
      </div>
    </div>

    <div id="fileList" class="mt-6 space-y-2"></div>

    <div class="mt-12 grid grid-cols-3 gap-4">
      <div class="bg-gray-900/60 border border-white/10 rounded-2xl p-5 text-center cursor-pointer hover:border-indigo-500/40 transition-all">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-indigo-500/20 flex items-center justify-center">
          <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
        </div>
        <p class="text-white font-medium text-sm">Documents</p>
        <p class="text-xs text-gray-500 mt-1">12 files</p>
      </div>

      <div class="bg-gray-900/60 border border-white/10 rounded-2xl p-5 text-center cursor-pointer hover:border-purple-500/40 transition-all">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-purple-500/20 flex items-center justify-center">
          <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <p class="text-white font-medium text-sm">Images</p>
        <p class="text-xs text-gray-500 mt-1">8 files</p>
      </div>

      <div class="bg-gray-900/60 border border-white/10 rounded-2xl p-5 text-center cursor-pointer hover:border-cyan-500/40 transition-all">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-cyan-500/20 flex items-center justify-center">
          <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
          </svg>
        </div>
        <p class="text-white font-medium text-sm">Audio</p>
        <p class="text-xs text-gray-500 mt-1">5 files</p>
      </div>
    </div>

  </div>

  <script>
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    uploadBtn.addEventListener('click', () => fileInput.click());

    document.body.addEventListener('dragover', (e) => e.preventDefault());
    document.body.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      [...files].forEach((file, i) => setTimeout(() => addFile(file), i * 100));
    }

    function addFile(file) {
      const div = document.createElement('div');
      div.className = 'folder-item bg-gray-800/60 border border-white/10 rounded-xl p-3 flex items-center gap-3';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-indigo-400" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm truncate">${file.name}</p>
        </div>
        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      `;
      fileList.appendChild(div);
    }
  </script>

</body>
</html>
