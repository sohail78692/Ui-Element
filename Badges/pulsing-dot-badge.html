<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pulsing Dot Badge UI Component">
<title>Pulsing Dot Badge</title>
<style>
body { background:#0a0a12; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;gap:20px; }
.badge-pulse {
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  background:#1a1a2e;
  border-radius:20px;
  color:#fff;
  font-size:14px;
}
.badge-pulse .dot {
  width:10px;height:10px;
  background:#00ff88;
  border-radius:50%;
  animation:pulse-glow 1.5s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,0.5);}
  50%{box-shadow:0 0 0 8px rgba(0,255,136,0);}
}
</style>
</head>
<body>
<span class="badge-pulse"><span class="dot"></span>Live</span>
</body>
</html>
