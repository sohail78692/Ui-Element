<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Glass Morph Badge UI Component">
<title>Glass Morph Badge</title>
<style>
body {
    background: #0d0d12;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 16px;
    flex-wrap: wrap;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
}

.badge-blue {
    background: rgba(99, 102, 241, 0.15);
    color: #818cf8;
}

.badge-green {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
}

.badge-purple {
    background: rgba(139, 92, 246, 0.15);
    color: #a78bfa;
}

.badge-orange {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
}

.badge:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.3);
}

.icon {
    width: 16px;
    height: 16px;
}
</style>
</head>
