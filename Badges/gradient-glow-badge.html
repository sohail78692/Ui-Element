<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Gradient Glow Badge UI Component">
<title>Gradient Glow Badge</title>
<style>
body {
    background: #0d0d12;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 16px;
    flex-wrap: wrap;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.badge-primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
}

.badge-success {
    background: linear-gradient(135deg, #10b981, #34d399);
    color: #fff;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
}

.badge-warning {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #1f2937;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
}

.badge-danger {
    background: linear-gradient(135deg, #ef4444, #f87171);
    color: #fff;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.8;
}
</style>
</head>
<body>
<span class="badge badge-primary"><span class="dot"></span>Primary</span>
<span class="badge badge-success"><span class="dot"></span>Success</span>
<span class="badge badge-warning"><span class="dot"></span>Warning</span>
<span class="badge badge-danger"><span class="dot"></span>Error</span>
</body>
</html>
