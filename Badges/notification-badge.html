<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Notification Badge UI Component">
<title>Notification Badge</title>
<style>
body { background:#0d0d14; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.notify-wrap { position:relative; display:inline-block; }
.notify-wrap .icon {
  width:48px;height:48px;
  background:#1a1a2e;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}
.notify-wrap .badge {
  position:absolute;
  top:-6px;right:-6px;
  min-width:20px;height:20px;
  background:#ff3366;
  border-radius:10px;
  color:#fff;
  font-size:11px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
  animation:badge-pulse 2s ease-in-out infinite;
}
@keyframes badge-pulse {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.1);}
}
</style>
</head>
<body>
<div class="notify-wrap">
  <div class="icon">🔔</div>
  <span class="badge">3</span>
</div>
</body>
</html>
