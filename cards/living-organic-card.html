<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Organic Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Inter', sans-serif;
            padding: 40px;
        }
        .organic-card {
            position: relative;
            width: 100%;
            max-width: 380px;
            padding: 40px;
            background: linear-gradient(160deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 40px;
            transform: rotate(-2deg);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: organicBreathe 8s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        .organic-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255, 140, 100, 0.05) 0%, transparent 50%);
            animation: organicShift 12s ease-in-out infinite;
        }
        @keyframes organicBreathe {
            0%, 100% { 
                border-radius: 40px 42px 38px 44px; 
                transform: rotate(-2deg) scale(1);
            }
            25% { 
                border-radius: 42px 38px 44px 40px; 
                transform: rotate(-1deg) scale(1.01);
            }
            50% { 
                border-radius: 38px 44px 40px 42px; 
                transform: rotate(-3deg) scale(0.99);
            }
            75% { 
                border-radius: 44px 40px 42px 38px; 
                transform: rotate(-2deg) scale(1.005);
            }
        }
        @keyframes organicShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }
        .organic-card:hover {
            transform: rotate(0deg) scale(1.02);
            border-color: rgba(255, 140, 100, 0.2);
            box-shadow: 0 20px 60px rgba(255, 140, 100, 0.08);
        }
        .organic-card:hover::after {
            opacity: 1;
        }
        .organic-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,140,100,0.03) 0%, transparent 50%);
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        .card-topo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.15;
        }
        .topo-blob {
            position: absolute;
            background: radial-gradient(circle at center, rgba(255,140,100,0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            animation: blobFloat 10s ease-in-out infinite;
        }
        .topo-blob:nth-child(1) {
            width: 120px;
            height: 120px;
            top: 10%;
            right: 10%;
            animation-delay: 0s;
        }
        .topo-blob:nth-child(2) {
            width: 180px;
            height: 180px;
            bottom: 20%;
            left: 5%;
            animation-delay: -3s;
            background: radial-gradient(circle at center, rgba(100, 200, 255, 0.3) 0%, transparent 70%);
        }
        .topo-blob:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 60%;
            right: 20%;
            animation-delay: -6s;
            background: radial-gradient(circle at center, rgba(255, 200, 100, 0.35) 0%, transparent 70%);
        }
        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20px, -30px) scale(1.1); }
            66% { transform: translate(-15px, 20px) scale(0.9); }
        }
        .card-content {
            position: relative;
            z-index: 2;
        }
        .card-category {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 140, 100, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 16px;
        }
        .card-description {
            font-size: 14px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }
        .card-stats {
            display: flex;
            gap: 24px;
            margin-bottom: 30px;
        }
        .stat-item {
            flex: 1;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            font-family: 'Playfair Display', serif;
        }
        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .author-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #fff;
        }
        .author-details {
            display: flex;
            flex-direction: column;
        }
        .author-name {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
        }
        .author-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .card-action {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 140, 100, 0.15);
            border: 1px solid rgba(255, 140, 100, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card-action:hover {
            background: rgba(255, 140, 100, 0.25);
            border-color: rgba(255, 140, 100, 0.5);
            transform: scale(1.1);
        }
        .card-action svg {
            width: 18px;
            height: 18px;
            fill: rgba(255, 140, 100, 0.8);
        }
        .organic-card:hover .card-action svg {
            fill: #ff8c64;
        }
    </style>
</head>
<body>
    <div class="organic-card">
        <div class="card-topo">
            <div class="topo-blob"></div>
            <div class="topo-blob"></div>
            <div class="topo-blob"></div>
        </div>
        <div class="card-content">
            <div class="card-category">Nature &bull; Organic</div>
            <h2 class="card-title">Living Architecture</h2>
            <p class="card-description">
                Explore the intersection of biotechnology and design, where structures grow, adapt, and breathe like living organisms.
            </p>
            <div class="card-stats">
                <div class="stat-item">
                    <div class="stat-value">2.4K</div>
                    <div class="stat-label">Views</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">186</div>
                    <div class="stat-label">Likes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">42</div>
                    <div class="stat-label">Comments</div>
                </div>
            </div>
            <div class="card-footer">
                <div class="author-info">
                    <div class="author-avatar">EL</div>
                    <div class="author-details">
                        <span class="author-name">Elena Vasquez</span>
                        <span class="author-date">Apr 14, 2026</span>
                    </div>
                </div>
                <div class="card-action">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
            </div>
        </div>
    </div>
    <script>
        const card = document.querySelector('.organic-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const tiltX = (y / rect.height) * 5;
            const tiltY = (x / rect.width) * -5;
            card.style.transform = `rotate(${-2 + tiltX}deg) rotateY(${tiltY}deg) scale(1.02)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotate(-2deg) scale(1)';
        });
    </script>
</body>
</html>
