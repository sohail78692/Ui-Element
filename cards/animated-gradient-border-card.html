<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Gradient Border Card UI Component">
<title>Gradient Border Card</title>
<style>
body { background:#0d0d15; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.gradient-card {
  position:relative;
  width:300px;
  padding:30px;
  background:#151520;
  border-radius:16px;
}
.gradient-card::before {
  content:'';
  position:absolute;
  inset:-3px;
  background:linear-gradient(135deg,#ff0066,#00ff66,#00ccff,#ff0066);
  background-size:300% 300%;
  border-radius:18px;
  z-index:-1;
  animation:gradient-anim 4s ease infinite;
}
.gradient-card h3 {
  color:#fff;
  margin:0 0 12px;
  font-size:24px;
}
.gradient-card p {
  color:#999;
  margin:0;
  line-height:1.6;
}
@keyframes gradient-anim {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
</style>
</head>
<body>
<div class="gradient-card">
  <h3>Gradient Border</h3>
  <p>A card with an animated gradient border that flows smoothly around the edges.</p>
</div>
</body>
</html>
