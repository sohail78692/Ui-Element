<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Holographic Chip Badge UI Component">
<title>Holographic Chip Badge</title>
<style>
body { background:#0a0a12; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;gap:20px;flex-wrap:wrap; }
.chip {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 20px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:50px;
  color:#fff;
  font-family:sans-serif;
  font-size:14px;
  cursor:pointer;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}
.chip::before {
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  transition:left 0.5s ease;
}
.chip:hover::before {
  left:100%;
}
.chip:hover {
  background:rgba(255,255,255,0.15);
  border-color:#00ffaa;
  box-shadow:0 0 20px rgba(0,255,170,0.3);
}
.chip .dot {
  width:8px;height:8px;
  border-radius:50%;
  background:#00ffaa;
  box-shadow:0 0 8px #00ffaa;
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(0.8);}
}
.chip.info .dot { background:#00aaff;box-shadow:0 0 8px #00aaff; }
.chip.warning .dot { background:#ffaa00;box-shadow:0 0 8px #ffaa00; }
.chip.error .dot { background:#ff4466;box-shadow:0 0 8px #ff4466; }
</style>
</head>
<body>
<span class="chip"><span class="dot"></span>Active</span>
<span class="chip info"><span class="dot"></span>Info</span>
<span class="chip warning"><span class="dot"></span>Warning</span>
<span class="chip error"><span class="dot"></span>Error</span>
</body>
</html>
