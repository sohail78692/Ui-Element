<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Simple Avatar UI Component">
<title>Simple Avatar</title>
<style>
body { background:#0d0d14; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;gap:16px; }
.avatar {
  width:48px;
  height:48px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff6b6b,#feca57);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  font-size:18px;
}
.avatar.lg { width:64px;height:64px;font-size:24px; }
.avatar.sm { width:32px;height:32px;font-size:12px; }
.avatar img { width:100%;height:100%;border-radius:50%;object-fit:cover; }
</style>
</head>
<body>
<div class="avatar sm">A</div>
<div class="avatar">B</div>
<div class="avatar lg">C</div>
</body>
</html>
