<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Chip Tag UI Component">
<title>Chip Tag</title>
<style>
body { background:#0d0d14; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;gap:12px;flex-wrap:wrap; }
.chip-tag {
  padding:8px 16px;
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  color:#bbb;
  font-size:13px;
  cursor:pointer;
  transition:all 0.2s;
  border:1px solid transparent;
}
.chip-tag:hover {
  background:rgba(255,255,255,0.15);
  color:#fff;
}
.chip-tag.active {
  background:rgba(0,200,255,0.2);
  border-color:#00ccff;
  color:#00ccff;
}
.chip-tag.close {
  padding-right:8px;
}
.chip-tag .x {
  margin-left:8px;
  opacity:0.5;
  font-weight:bold;
}
.chip-tag:hover .x { opacity:1; }
</style>
</head>
<body>
<span class="chip-tag active">JavaScript</span>
<span class="chip-tag">React</span>
<span class="chip-tag">TypeScript</span>
<span class="chip-tag close">Vue<span class="x">×</span></span>
</body>
</html>
