<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Skeleton Card UI Component">
<title>Skeleton Card</title>
<style>
body { background:#0a0a12; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.skeleton-card {
  width:300px;
  padding:20px;
  background:#14141e;
  border-radius:12px;
}
.skeleton-card .skeleton {
  background:linear-gradient(90deg,#1a1a2e 25%,#252540 50%,#1a1a2e 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:4px;
}
.skeleton-card .skeleton-avatar {
  width:48px;height:48px;
  border-radius:50%;
  margin-bottom:16px;
}
.skeleton-card .skeleton-line {
  height:14px;
  margin-bottom:10px;
}
.skeleton-card .skeleton-line:last-child { width:60%; }
@keyframes shimmer {
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}
</style>
</head>
<body>
<div class="skeleton-card">
  <div class="skeleton skeleton-avatar"></div>
  <div class="skeleton skeleton-line"></div>
  <div class="skeleton skeleton-line"></div>
  <div class="skeleton skeleton-line"></div>
</div>
</body>
</html>
