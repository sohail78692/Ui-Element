<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Circular Progress UI Component">
<title>Circular Progress</title>
<style>
body { background:#0a0a10; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;gap:40px; }
.circle-progress {
  position:relative;
  width:100px;
  height:100px;
}
.circle-progress svg {
  transform:rotate(-90deg);
}
.circle-progress .bg {
  fill:none;
  stroke:#222;
  stroke-width:8;
}
.circle-progress .progress {
  fill:none;
  stroke:#00ffaa;
  stroke-width:8;
  stroke-linecap:round;
  stroke-dasharray:251;
  stroke-dashoffset:75;
  transition:stroke-dashoffset 0.5s;
}
.circle-progress .value {
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:20px;
  font-weight:bold;
  color:#fff;
}
</style>
</head>
<body>
<div class="circle-progress">
  <svg width="100" height="100">
    <circle class="bg" cx="50" cy="50" r="40"/>
    <circle class="progress" cx="50" cy="50" r="40"/>
  </svg>
  <span class="value">70%</span>
</div>
</body>
</html>
