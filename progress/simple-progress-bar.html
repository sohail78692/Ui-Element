<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Simple Progress Bar UI Component">
<title>Simple Progress Bar</title>
<style>
body { background:#0a0a12; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;flex-direction:column;gap:20px; }
.progress-simple {
  width:300px;
  height:8px;
  background:#1a1a2e;
  border-radius:4px;
  overflow:hidden;
}
.progress-simple .fill {
  height:100%;
  background:linear-gradient(90deg,#00ccff,#00ffaa);
  border-radius:4px;
  width:65%;
}
.progress-simple.secondary .fill { background:#8b5cf6; }
</style>
</head>
<body>
<div class="progress-simple"><div class="fill"></div></div>
<div class="progress-simple secondary"><div class="fill" style="width:40%"></div></div>
</body>
</html>
