<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesseract Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #08080c;
            font-family: 'Space Grotesk', sans-serif;
            perspective: 1000px;
        }
        .tesseract-container {
            position: relative;
            width: 180px;
            height: 180px;
            transform-style: preserve-3d;
            animation: rotateTesseract 15s infinite linear;
        }
        @keyframes rotateTesseract {
            0% { transform: rotateX(-20deg) rotateY(0deg); }
            100% { transform: rotateX(-20deg) rotateY(360deg); }
        }
        .tesseract-core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            margin: -30px 0 0 -30px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transform-style: preserve-3d;
            box-shadow: 
                0 0 40px rgba(99, 102, 241, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .tesseract-core:hover {
            box-shadow: 
                0 0 60px rgba(99, 102, 241, 0.8),
                inset 0 0 40px rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }
        .tesseract-core svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
        }
        .tesseract-face {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin: -25px 0 0 -25px;
            background: rgba(99, 102, 241, 0.15);
            border: 2px solid rgba(99, 102, 241, 0.4);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }
        .tesseract-container:hover .tesseract-face {
            opacity: 1;
        }
        .tesseract-face:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.8);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
            transform: scale(1.2) !important;
        }
        .tesseract-face svg {
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.7);
            transition: fill 0.3s;
        }
        .tesseract-face:hover svg {
            fill: #ffffff;
        }
        .tesseract-face .label {
            position: absolute;
            bottom: -25px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .tesseract-face:nth-child(1) { transform: translateZ(100px); }
        .tesseract-face:nth-child(2) { transform: rotateY(90deg) translateZ(100px); }
        .tesseract-face:nth-child(3) { transform: rotateY(180deg) translateZ(100px); }
        .tesseract-face:nth-child(4) { transform: rotateY(-90deg) translateZ(100px); }
        .tesseract-face:nth-child(5) { transform: rotateX(90deg) translateZ(100px); }
        .tesseract-face:nth-child(6) { transform: rotateX(-90deg) translateZ(100px); }
        .tesseract-face:nth-child(1) .label { transform: translateZ(100px) rotateX(-90deg); }
        .tesseract-face:nth-child(2) .label { transform: rotateY(-90deg) translateZ(100px) rotateX(-90deg); }
        .tesseract-face:nth-child(3) .label { transform: rotateY(180deg) translateZ(100px) rotateX(-90deg); }
        .tesseract-face:nth-child(4) .label { transform: rotateY(90deg) translateZ(100px) rotateX(-90deg); }
        .tesseract-face:nth-child(5) .label { transform: rotateX(90deg) translateZ(100px) rotateX(-90deg); }
        .tesseract-face:nth-child(6) .label { transform: rotateX(-90deg) translateZ(100px) rotateX(-90deg); }
        .dimensional-rift {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            margin: -110px 0 0 -110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            animation: pulseRift 4s ease-in-out infinite;
        }
        @keyframes pulseRift {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
        .controls {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 15px;
        }
        .control-btn {
            padding: 12px 24px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #8b5cf6;
            color: #ffffff;
        }
        .tooltip {
            position: fixed;
            top: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            color: #8b5cf6;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="tesseract-container" id="tesseract">
        <div class="dimensional-rift"></div>
        <div class="tesseract-core" data-action="home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="label">Home</span>
        </div>
        <div class="tesseract-face" data-action="explore">
            <svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
            <span class="label">Explore</span>
        </div>
        <div class="tesseract-face" data-action="create">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <span class="label">Create</span>
        </div>
        <div class="tesseract-face" data-action="messages">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
            <span class="label">Messages</span>
        </div>
        <div class="tesseract-face" data-action="profile">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="label">Profile</span>
        </div>
        <div class="tesseract-face" data-action="settings">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span class="label">Settings</span>
        </div>
    </div>
    <div class="controls">
        <button class="control-btn" id="pauseBtn">Pause Rotation</button>
        <button class="control-btn" id="speedBtn">Increase Speed</button>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <script>
        const tesseract = document.getElementById('tesseract');
        const faces = document.querySelectorAll('.tesseract-face, .tesseract-core');
        const tooltip = document.getElementById('tooltip');
        const pauseBtn = document.getElementById('pauseBtn');
        const speedBtn = document.getElementById('speedBtn');
        let isPaused = false;
        let speedMultiplier = 1;
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            tesseract.style.animationPlayState = isPaused ? 'paused' : 'running';
            pauseBtn.textContent = isPaused ? 'Resume Rotation' : 'Pause Rotation';
        });
        speedBtn.addEventListener('click', () => {
            speedMultiplier = speedMultiplier === 1 ? 2 : speedMultiplier === 2 ? 0.5 : 1;
            tesseract.style.animationDuration = (15 / speedMultiplier) + 's';
            speedBtn.textContent = speedMultiplier === 1 ? 'Increase Speed' : 
                                   speedMultiplier === 2 ? 'Half Speed' : 'Normal Speed';
        });
        faces.forEach(face => {
            face.addEventListener('click', () => {
                const action = face.getAttribute('data-action');
                tooltip.textContent = `Navigating to ${action}...`;
                tooltip.classList.add('show');
                setTimeout(() => tooltip.classList.remove('show'), 2000);
            });
            face.addEventListener('mouseenter', (e) => {
                const action = face.getAttribute('data-action');
                tooltip.textContent = action;
                tooltip.classList.add('show');
            });
            face.addEventListener('mousemove', (e) => {
                tooltip.style.left = e.clientX + 15 + 'px';
                tooltip.style.top = e.clientY - 10 + 'px';
            });
            face.addEventListener('mouseleave', () => {
                tooltip.classList.remove('show');
            });
        });
        document.addEventListener('mousemove', (e) => {
            if (!isPaused) {
                const x = (window.innerWidth / 2 - e.clientX) / 50;
                const y = (window.innerHeight / 2 - e.clientY) / 50;
                tesseract.style.transform = `rotateX(${-20 + y}deg) rotateY(${x}deg)`;
            }
        });
    </script>
</body>
</html>
