<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Morph Modal</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #08080a;
            font-family: 'Syne', sans-serif;
            overflow: hidden;
        }
        .blob-bg {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            filter: blur(60px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: blob-move 8s ease-in-out infinite;
            pointer-events: none;
        }
        .blob-bg:nth-child(2) {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            animation-delay: -4s;
        }
        @keyframes blob-move {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }
        .trigger-btn {
            padding: 18px 48px;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.6), rgba(59, 130, 246, 0.6));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            letter-spacing: 1px;
        }
        .trigger-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .trigger-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.4);
        }
        .trigger-btn:hover::before {
            opacity: 1;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            z-index: 1000;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-liquid {
            position: relative;
            width: 90%;
            max-width: 500px;
            padding: 50px 40px;
            background: rgba(20, 20, 25, 0.9);
            border-radius: 24px;
            transform: translateY(50px) scale(0.9);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            overflow: hidden;
        }
        .modal-overlay.active .modal-liquid {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .liquid-orb {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, transparent 70%);
            filter: blur(30px);
            top: -80px;
            right: -50px;
            animation: orb-float 4s ease-in-out infinite;
        }
        .liquid-orb:nth-child(2) {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
            top: auto;
            bottom: -50px;
            left: -30px;
            animation-delay: -2s;
        }
        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10px, -20px); }
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .modal-close:hover {
            background: rgba(139, 92, 246, 0.3);
            transform: rotate(90deg);
        }
        .modal-close::before,
        .modal-close::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
        }
        .modal-close::before { transform: rotate(45deg); }
        .modal-close::after { transform: rotate(-45deg); }
        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.2));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .modal-icon::before {
            content: '';
            width: 40px;
            height: 40px;
            border: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: icon-pulse 2s ease-in-out infinite;
        }
        @keyframes icon-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        .modal-title {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, rgba(139, 92, 246, 0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .modal-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .modal-btn {
            flex: 1;
            padding: 16px 24px;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: #fff;
            border: none;
        }
        .modal-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-btn.secondary:hover {
            border-color: rgba(139, 92, 246, 0.5);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="blob-bg"></div>
    <div class="blob-bg"></div>
    <button class="trigger-btn" id="openModal">LAUNCH INTERFACE</button>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-liquid">
            <div class="liquid-orb"></div>
            <div class="liquid-orb"></div>
            <button class="modal-close" id="closeModal"></button>
            <div class="modal-icon"></div>
            <h2 class="modal-title">Neural Sync</h2>
            <p class="modal-subtitle">Enter your credentials to establish connection</p>
            <div class="input-group">
                <input type="text" placeholder="Username" id="username">
            </div>
            <div class="input-group">
                <input type="password" placeholder="Access Key" id="accessKey">
            </div>
            <div class="modal-actions">
                <button class="modal-btn secondary" id="cancelBtn">Cancel</button>
                <button class="modal-btn primary" id="confirmBtn">Connect</button>
            </div>
        </div>
    </div>
    <script>
        const openBtn = document.getElementById('openModal');
        const closeBtn = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const overlay = document.getElementById('modalOverlay');
        openBtn.addEventListener('click', () => {
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
        function closeModal() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        confirmBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
