<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Plasma Core Modal UI Component">
<title>Plasma Core Modal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .plasma-modal {
        position: relative;
        width: 420px;
        padding: 32px;
        background: rgba(20, 20, 30, 0.95);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
    }
    .plasma-modal::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(from 0deg, transparent, rgba(139, 92, 246, 0.3), transparent, rgba(236, 72, 153, 0.3), transparent);
        animation: plasma-rotate 4s linear infinite;
        opacity: 0.5;
    }
    @keyframes plasma-rotate {
        100% { transform: rotate(360deg); }
    }
    .modal-content {
        position: relative;
        z-index: 1;
        text-align: center;
    }
    .modal-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
    }
    .modal-icon svg {
        width: 32px;
        height: 32px;
        color: #fff;
    }
    .modal-title {
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 12px;
    }
    .modal-text {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 24px;
        line-height: 1.6;
    }
    .modal-actions {
        display: flex;
        gap: 12px;
    }
    .modal-btn {
        flex: 1;
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .modal-btn-primary {
        color: #fff;
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    }
    .modal-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
    }
    .modal-btn-secondary {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
    }
    .modal-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    .plasma-orb {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.3;
        pointer-events: none;
    }
    .plasma-orb-1 {
        top: -30px;
        right: -30px;
        background: #8b5cf6;
    }
    .plasma-orb-2 {
        bottom: -30px;
        left: -30px;
        background: #ec4899;
    }
</style>
</head>
<body>
<div class="plasma-modal">
    <div class="plasma-orb plasma-orb-1"></div>
    <div class="plasma-orb plasma-orb-2"></div>
    <div class="modal-content">
        <div class="modal-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>
        <h2 class="modal-title">Security Alert</h2>
        <p class="modal-text">We've detected a new login from a different device. Please verify your identity to continue.</p>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-secondary">Deny</button>
            <button class="modal-btn modal-btn-primary">Verify</button>
        </div>
    </div>
</div>
</body>
</html>
