<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Neural Chat Interface UI Component">
<title>Neural Chat Interface</title>
<style>
body {
    background: #0a0a0f;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.chat-container {
    width: 400px;
    background: linear-gradient(145deg, #12121a, #1a1a24);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.chat-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 12px;
}

.ai-orb {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: orb-pulse 3s ease-in-out infinite;
}

@keyframes orb-pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
    50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.6); }
}

.ai-orb svg {
    width: 20px;
    height: 20px;
    fill: #fff;
}

.chat-title {
    flex: 1;
}

.chat-title h3 {
    margin: 0;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
}

.chat-title span {
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
}

.chat-messages {
    padding: 20px;
    height: 250px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
}

.message {
    display: flex;
    gap: 10px;
    animation: fade-in 0.3s ease;
}

@keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message-ai {
    align-items: flex-start;
}

.message-user {
    align-items: flex-end;
    flex-direction: row-reverse;
}

.message-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.5;
}

.message-ai .message-bubble {
    background: rgba(99, 102, 241, 0.15);
    color: #e0e7ff;
    border-bottom-left-radius: 4px;
}

.message-user .message-bubble {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border-bottom-right-radius: 4px;
}

.chat-input-area {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 12px;
    background: rgba(0, 0, 0, 0.2);
}

.chat-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-size: 13px;
    outline: none;
    transition: all 0.3s ease;
}

.chat-input::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.chat-input:focus {
    border-color: #6366f1;
    background: rgba(99, 102, 241, 0.1);
}

.send-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
}

.send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
}

.send-btn svg {
    width: 18px;
    height: 18px;
    fill: #fff;
}
</style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="ai-orb">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <div class="chat-title">
            <h3>AI Assistant</h3>
            <span>Online</span>
        </div>
    </div>
    <div class="chat-messages">
        <div class="message message-ai">
            <div class="message-bubble">Hello! How can I help you today?</div>
        </div>
        <div class="message message-user">
            <div class="message-bubble">I need help with my project</div>
        </div>
    </div>
    <div class="chat-input-area">
        <input type="text" class="chat-input" placeholder="Type a message...">
        <button class="send-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>
</body>
</html>
