<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI Response Stream UI Component">
<title>AI Response Stream</title>
<style>
body {
    background: #0a0a0f;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.response-stream {
    width: 420px;
    background: linear-gradient(145deg, #12121a, #1a1a24);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.stream-header {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stream-title {
    display: flex;
    align-items: center;
    gap: 10px;
}

.stream-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    display: flex;
    align-items: center;
    justify-content: center;
}

.stream-icon svg {
    width: 16px;
    height: 16px;
    fill: #fff;
}

.stream-title span {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
}

.stream-status {
    padding: 4px 10px;
    border-radius: 10px;
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #34d399;
    animation: status-blink 1.5s ease-in-out infinite;
}

@keyframes status-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.stream-content {
    padding: 20px;
    min-height: 200px;
}

.response-text {
    color: #e0e7ff;
    font-size: 13px;
    line-height: 1.7;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: #6366f1;
    margin-left: 2px;
    animation: cursor-blink 0.8s ease-in-out infinite;
    vertical-align: middle;
}

@keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

.token-preview {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.token-label {
    color: rgba(255, 255, 255, 0.5);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.token-bar {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
}

.token-fill {
    height: 100%;
    width: 67%;
    border-radius: 3px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    animation: token-progress 2s ease-out;
}

@keyframes token-progress {
    from { width: 0; }
}

.token-count {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
}

.token-current {
    color: #a78bfa;
}

.token-max {
    color: rgba(255, 255, 255, 0.4);
}

.stream-actions {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    gap: 10px;
}

.action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}

.action-btn:hover {
    background: rgba(99, 102, 241, 0.15);
    border-color: #6366f1;
    color: #fff;
}
</style>
</head>
<body>
<div class="response-stream">
    <div class="stream-header">
        <div class="stream-title">
            <div class="stream-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <span>Generating...</span>
        </div>
        <div class="stream-status">
            <span class="status-dot"></span>
            Processing
        </div>
    </div>
    <div class="stream-content">
        <div class="response-text">
            The neural network processes input through multiple layers of interconnected nodes, transforming raw data into meaningful representations.<span class="cursor"></span>
        </div>
        <div class="token-preview">
            <div class="token-label">Token Usage</div>
            <div class="token-bar">
                <div class="token-fill"></div>
            </div>
            <div class="token-count">
                <span class="token-current">2,048 tokens</span>
                <span class="token-max">/ 4,096 max</span>
            </div>
        </div>
    </div>
    <div class="stream-actions">
        <button class="action-btn">Stop</button>
        <button class="action-btn">Regenerate</button>
    </div>
</div>
</body>
</html>
