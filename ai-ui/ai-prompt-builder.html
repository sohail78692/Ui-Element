<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI Prompt Builder UI Component">
<title>AI Prompt Builder</title>
<style>
body {
    background: #0a0a0f;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.prompt-builder {
    width: 450px;
    background: linear-gradient(145deg, #12121a, #1a1a24);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.builder-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #10b981, #34d399);
    display: flex;
    align-items: center;
    justify-content: center;
}

.header-icon svg {
    width: 20px;
    height: 20px;
    fill: #fff;
}

.header-title h3 {
    margin: 0;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
}

.header-title span {
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
}

.builder-content {
    padding: 20px;
}

.prompt-label {
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: block;
}

.prompt-textarea {
    width: 100%;
    height: 120px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.prompt-textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
}

.prompt-textarea:focus {
    border-color: #10b981;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
}

.tone-section {
    margin-top: 20px;
}

.tone-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
}

.tone-chip {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.tone-chip:hover {
    background: rgba(16, 185, 129, 0.15);
    border-color: #10b981;
    color: #10b981;
}

.tone-chip.active {
    background: rgba(16, 185, 129, 0.2);
    border-color: #10b981;
    color: #10b981;
}

.builder-footer {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.char-count {
    color: rgba(255, 255, 255, 0.4);
    font-size: 12px;
}

.generate-btn {
    padding: 12px 24px;
    border-radius: 10px;
    background: linear-gradient(135deg, #10b981, #34d399);
    border: none;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.generate-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
}
</style>
</head>
<body>
<div class="prompt-builder">
    <div class="builder-header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6C7.8 12.16 7 10.63 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
        </div>
        <div class="header-title">
            <h3>Prompt Builder</h3>
            <span>AI Power Tools</span>
        </div>
    </div>
    <div class="builder-content">
        <label class="prompt-label">Describe your request</label>
        <textarea class="prompt-textarea" placeholder="Write a story about a space explorer..."></textarea>
        <div class="tone-section">
            <span class="prompt-label">Tone</span>
            <div class="tone-chips">
                <span class="tone-chip active">Creative</span>
                <span class="tone-chip">Professional</span>
                <span class="tone-chip">Casual</span>
                <span class="tone-chip">Academic</span>
            </div>
        </div>
    </div>
    <div class="builder-footer">
        <span class="char-count">0 / 500</span>
        <button class="generate-btn">Generate</button>
    </div>
</div>
</body>
</html>
