<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Energy Pulse Loader UI Component">
<title>Energy Pulse Loader</title>
<style>
body {
    background: #0c0c12;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.energy-loader {
    position: relative;
    width: 80px;
    height: 80px;
}
.energy-loader .core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    background: #80ffea;
    border-radius: 50%;
    animation: corePulse 1.5s ease-in-out infinite;
}
.energy-loader .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border: 2px solid transparent;
    border-top-color: #ff80c0;
    border-right-color: #80ffea;
    border-radius: 50%;
    animation: energySpin 1.2s linear infinite;
}
.energy-loader .ring:nth-child(1) {
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
}
.energy-loader .ring:nth-child(2) {
    width: 50px;
    height: 50px;
    margin: -25px 0 0 -25px;
    animation-direction: reverse;
    animation-duration: 1.5s;
}
.energy-loader .ring:nth-child(3) {
    width: 70px;
    height: 70px;
    margin: -35px 0 0 -35px;
    border-color: transparent;
    border-bottom-color: #80ffea;
    animation-duration: 2s;
}
@keyframes corePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
}
@keyframes energySpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="energy-loader">
    <span class="ring"></span>
    <span class="ring"></span>
    <span class="ring"></span>
    <span class="core"></span>
</div>

</body>
</html>
