<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" description="Cosmic Spiral Loader UI Component">
<title>Cosmic Spiral Loader</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050510;
    }
    .cosmic-spiral {
        position: relative;
        width: 100px;
        height: 100px;
    }
    .spiral-orb {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        animation: spiral-orbit 2s linear infinite;
    }
    .spiral-orb:nth-child(1) { animation-delay: 0s; background: #8b5cf6; }
    .spiral-orb:nth-child(2) { animation-delay: 0.15s; background: #a855f7; }
    .spiral-orb:nth-child(3) { animation-delay: 0.3s; background: #c084fc; }
    .spiral-orb:nth-child(4) { animation-delay: 0.45s; background: #d8b4fe; }
    .spiral-orb:nth-child(5) { animation-delay: 0.6s; background: #e9d5ff; }
    .cosmic-core {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 30px;
        height: 30px;
        background: radial-gradient(circle, #8b5cf6, #4c1d95);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 30px #8b5cf6, 0 0 60px rgba(139, 92, 246, 0.5);
        animation: core-pulse 1s ease-in-out infinite;
    }
    @keyframes spiral-orbit {
        0% {
            transform: rotate(0deg) translateX(40px) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: rotate(360deg) translateX(40px) rotate(-360deg);
            opacity: 0.6;
        }
    }
    @keyframes core-pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.2); }
    }
    .spiral-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 80px;
        height: 80px;
        border: 2px dashed rgba(139, 92, 246, 0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: ring-spin 8s linear infinite;
    }
    @keyframes ring-spin {
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
</style>
</head>
<body>
<div class="cosmic-spiral">
    <div class="spiral-ring"></div>
    <div class="spiral-orb"></div>
    <div class="spiral-orb"></div>
    <div class="spiral-orb"></div>
    <div class="spiral-orb"></div>
    <div class="spiral-orb"></div>
    <div class="cosmic-core"></div>
</div>
</body>
</html>
