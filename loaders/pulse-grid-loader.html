<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Grid Loader UI Component">
<title>Grid Loader</title>
<style>
body { background:#0a0a12; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.grid-loader {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  width:60px;
  height:60px;
}
.grid-loader .cell {
  background:#00ccff;
  border-radius:4px;
  animation:grid-pulse 1.2s ease-in-out infinite;
}
.grid-loader .cell:nth-child(1){animation-delay:0s;}
.grid-loader .cell:nth-child(2){animation-delay:0.1s;}
.grid-loader .cell:nth-child(3){animation-delay:0.2s;}
.grid-loader .cell:nth-child(4){animation-delay:0.3s;}
.grid-loader .cell:nth-child(5){animation-delay:0.4s;}
.grid-loader .cell:nth-child(6){animation-delay:0.5s;}
.grid-loader .cell:nth-child(7){animation-delay:0.6s;}
.grid-loader .cell:nth-child(8){animation-delay:0.7s;}
.grid-loader .cell:nth-child(9){animation-delay:0.8s;}
@keyframes grid-pulse {
  0%,100%{opacity:0.3;transform:scale(0.8);}
  50%{opacity:1;transform:scale(1);}
}
</style>
</head>
<body>
<div class="grid-loader">
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
  <div class="cell"></div>
</div>
</body>
</html>
