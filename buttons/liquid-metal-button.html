<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Liquid Metal Button UI Component">
<title>Liquid Metal Button</title>
<style>
body {
    background: #1a1a2e;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.liquid-btn {
    position: relative;
    padding: 18px 50px;
    border: none;
    background: #0d0d0d;
    color: #b8b8b8;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    transition: color 0.4s ease;
}
.liquid-btn::before,
.liquid-btn::after {
    content: '';
    position: absolute;
    width: 150%;
    height: 150%;
    top: -25%;
    left: -25%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
    animation: liquidRotate 4s infinite linear;
}
.liquid-btn::after {
    animation: liquidRotate 6s infinite linear reverse;
    background: radial-gradient(circle, rgba(255,100,100,0.15) 0%, transparent 50%);
}
@keyframes liquidRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.liquid-btn span {
    position: relative;
    z-index: 1;
}
.liquid-btn:hover {
    color: #fff;
    box-shadow: 0 5px 30px rgba(255, 100, 100, 0.3);
}
</style>
</head>
<body>

<button type="button" class="liquid-btn">
    <span>Execute</span>
</button>

</body>
</html>
