<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Liquid Morph Button UI Component">
<title>Liquid Morph Button</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .liquid-morph-btn {
        position: relative;
        padding: 18px 44px;
        font-size: 17px;
        font-weight: 600;
        color: #fff;
        background: transparent;
        border: 2px solid #00d4ff;
        border-radius: 8px;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.4s ease;
    }
    .liquid-morph-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #00d4ff, #7b2ff7);
        border-radius: 6px;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: -1;
    }
    .liquid-morph-btn:hover {
        border-color: transparent;
        transform: scale(1.02);
        box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
    }
    .liquid-morph-btn:hover::before {
        opacity: 1;
    }
    .liquid-morph-btn span {
        position: relative;
        z-index: 1;
    }
    .blob {
        position: absolute;
        border-radius: 50%;
        background: rgba(0, 212, 255, 0.6);
        filter: blur(20px);
        animation: float 3s ease-in-out infinite;
        z-index: 0;
    }
    .blob:nth-child(1) { width: 60px; height: 60px; top: -20px; left: -20px; animation-delay: 0s; }
    .blob:nth-child(2) { width: 40px; height: 40px; bottom: -10px; right: -10px; animation-delay: 1s; background: rgba(123, 47, 247, 0.6); }
    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(10px, 10px) scale(1.1); }
    }
</style>
</head>
<body>
<button type="button" class="liquid-morph-btn">
    <div class="blob"></div>
    <div class="blob"></div>
    <span>Get Started</span>
</button>
</body>
</html>
