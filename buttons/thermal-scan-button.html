<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Thermal Scan Button UI Component">
<title>Thermal Scan Button</title>
<style>
body { background:#0a0a0f; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.btn-thermal {
  position:relative;
  padding:18px 48px;
  font-size:16px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
  border:2px solid #00ff88;
  border-radius:4px;
  cursor:pointer;
  overflow:hidden;
  transition:all 0.3s ease;
  text-transform:uppercase;
  letter-spacing:2px;
}
.btn-thermal::before {
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,0.3),transparent);
  transition:left 0.5s ease;
}
.btn-thermal:hover::before {
  left:100%;
}
.btn-thermal:hover {
  box-shadow:0 0 30px rgba(0,255,136,0.5),inset 0 0 20px rgba(0,255,136,0.1);
  border-color:#00ffaa;
}
.btn-thermal .scan-line {
  position:absolute;
  width:100%;height:2px;
  background:#00ff88;
  top:0;left:0;
  animation:scan 2s linear infinite;
  box-shadow:0 0 10px #00ff88;
}
@keyframes scan {
  0%{top:0;opacity:1;}
  50%{top:100%;opacity:0.3;}
  100%{top:0;opacity:1;}
}
.btn-thermal .temp {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  font-size:10px;
  color:#00ff88;
  opacity:0;
  transition:opacity 0.3s;
}
.btn-thermal:hover .temp {
  opacity:1;
}
</style>
</head>
<body>
<button class="btn-thermal">
  <span class="scan-line"></span>
  Thermal Scan
  <span class="temp">36.6°C</span>
</button>
</body>
</html>
