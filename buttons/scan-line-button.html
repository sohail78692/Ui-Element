<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Scan Line Button UI Component">
<title>Scan Line Button</title>
<style>
body { background:#0a0a0f; padding:50px; display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; }
.btn-scan {
  position:relative;
  padding:16px 44px;
  font-size:15px;
  font-weight:600;
  color:#00ff88;
  background:#0a0a0f;
  border:2px solid #00ff88;
  border-radius:4px;
  cursor:pointer;
  overflow:hidden;
  transition:all 0.3s;
  text-transform:uppercase;
  letter-spacing:2px;
}
.btn-scan:hover {
  background:#00ff88;
  color:#000;
  box-shadow:0 0 30px rgba(0,255,136,0.5);
}
.btn-scan .scan-line {
  position:absolute;
  width:100%;height:2px;
  background:#00ff88;
  left:0;
  box-shadow:0 0 10px #00ff88;
  animation:scan-move 2s linear infinite;
  opacity:0;
}
.btn-scan:hover .scan-line {
  opacity:1;
}
@keyframes scan-move {
  0%{top:0;}
  50%{top:100%;}
  100%{top:0;}
}
</style>
</head>
<body>
<button class="btn-scan">
  <span class="scan-line"></span>
  Scan System
</button>
</body>
</html>
