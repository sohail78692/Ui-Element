<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Holographic Glass Button UI Component">
<title>Holographic Glass Button</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .holo-glass-btn {
        position: relative;
        padding: 16px 42px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .holo-glass-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.6s;
    }
    .holo-glass-btn::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 16px;
        padding: 1px;
        background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent, rgba(255,255,255,0.1));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }
    .holo-glass-btn:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 40px rgba(0, 200, 255, 0.2);
    }
    .holo-glass-btn:hover::before {
        left: 100%;
    }
    .holo-shine {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
        border-radius: 16px 16px 0 0;
        pointer-events: none;
    }
</style>
</head>
<body>
<button type="button" class="holo-glass-btn">
    <div class="holo-shine"></div>
    Connect Wallet
</button>
</body>
</html>
