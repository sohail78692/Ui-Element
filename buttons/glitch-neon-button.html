<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Glitch Neon Button UI Component">
<title>Glitch Neon Button</title>
<style>
body {
    background: #0d0d0d;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.glitch-btn {
    position: relative;
    padding: 16px 40px;
    border: none;
    background: #111;
    color: #0ff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    overflow: hidden;
}
.glitch-btn::before,
.glitch-btn::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 16px 40px;
    background: #111;
    color: #0ff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 4px;
}
.glitch-btn::before {
    left: 2px;
    text-shadow: -1px 0 #f0f;
    clip-path: inset(0 0 0 0);
    animation: glitch1 2s infinite linear alternate-reverse;
}
.glitch-btn::after {
    left: -2px;
    text-shadow: -1px 0 #0ff;
    clip-path: inset(0 0 0 0);
    animation: glitch2 2s infinite linear alternate-reverse;
}
@keyframes glitch1 {
    0%, 100% { clip-path: inset(20% 0 80% 0); }
    20% { clip-path: inset(60% 0 10% 0); }
    40% { clip-path: inset(40% 0 50% 0); }
    60% { clip-path: inset(10% 0 70% 0); }
    80% { clip-path: inset(80% 0 5% 0); }
}
@keyframes glitch2 {
    0%, 100% { clip-path: inset(10% 0 60% 0); }
    20% { clip-path: inset(30% 0 20% 0); }
    40% { clip-path: inset(70% 0 30% 0); }
    60% { clip-path: inset(20% 0 50% 0); }
    80% { clip-path: inset(50% 0 10% 0); }
}
.glitch-btn:hover {
    box-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
}
</style>
</head>
<body>

<button type="button" class="glitch-btn" data-text="Override">Override</button>

</body>
</html>
