<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Starfield Button UI Component">
<title>Starfield Button</title>
<style>
body {
    background: #050510;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.starfield-btn {
    position: relative;
    padding: 18px 48px;
    border: 1px solid #2a2a4a;
    background: linear-gradient(180deg, #1a1a3a 0%, #0d0d24 100%);
    color: #a0a0c0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.4s ease;
}
.starfield-btn:hover {
    color: #fff;
    border-color: #4a4aff;
    box-shadow: 0 0 30px rgba(74, 74, 255, 0.3),
                inset 0 0 20px rgba(74, 74, 255, 0.1);
}
.starfield-btn .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
}
.starfield-btn:hover .star {
    animation: starBlink 1.5s ease-in-out infinite;
}
@keyframes starBlink {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>

<button type="button" class="starfield-btn">
    <span class="star" style="top: 20%; left: 20%; animation-delay: 0s;"></span>
    <span class="star" style="top: 30%; left: 70%; animation-delay: 0.2s;"></span>
    <span class="star" style="top: 60%; left: 30%; animation-delay: 0.4s;"></span>
    <span class="star" style="top: 70%; left: 80%; animation-delay: 0.6s;"></span>
    <span class="star" style="top: 40%; left: 50%; animation-delay: 0.8s;"></span>
    Warp Drive
</button>

</body>
</html>
