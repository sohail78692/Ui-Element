<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cosmic Swirl Button UI Component">
<title>Cosmic Swirl Button</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .cosmic-swirl-btn {
        position: relative;
        padding: 18px 50px;
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        background: #111;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.4s ease;
    }
    .cosmic-swirl-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: radial-gradient(circle, #6366f1, #ec4899, #f59e0b);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }
    .cosmic-swirl-btn:hover::before {
        width: 300px;
        height: 300px;
    }
    .cosmic-swirl-btn span {
        position: relative;
        z-index: 1;
    }
    .cosmic-swirl-btn:hover {
        color: #fff;
        box-shadow: 0 0 40px rgba(99, 102, 241, 0.6);
    }
    .stars {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 50px;
    }
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        border-radius: 50%;
        opacity: 0;
    }
    .cosmic-swirl-btn:hover .star {
        animation: twinkle 0.5s ease-out forwards;
    }
    @keyframes twinkle {
        0% { opacity: 1; transform: scale(0); }
        100% { opacity: 0; transform: scale(1); }
    }
</style>
</head>
<body>
<button type="button" class="cosmic-swirl-btn">
    <div class="stars"></div>
    <span>Discover</span>
</button>
<script>
    document.querySelector('.cosmic-swirl-btn').addEventListener('mouseenter', function() {
        const starsContainer = this.querySelector('.stars');
        starsContainer.innerHTML = '';
        for (let i = 0; i < 20; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 0.3 + 's';
            starsContainer.appendChild(star);
        }
    });
</script>
</body>
</html>
