<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Distortion</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }
        .holo-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .holo-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid;
            animation: rotateRing 10s linear infinite;
        }
        .holo-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-color: rgba(0, 255, 255, 0.3);
            animation-duration: 15s;
        }
        .holo-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            border-color: rgba(0, 255, 255, 0.4);
            animation-duration: 12s;
            animation-direction: reverse;
        }
        .holo-ring:nth-child(3) {
            width: 70%;
            height: 70%;
            border-color: rgba(0, 255, 255, 0.5);
            animation-duration: 9s;
        }
        .holo-ring:nth-child(4) {
            width: 55%;
            height: 55%;
            border-color: rgba(0, 255, 255, 0.6);
            animation-duration: 6s;
            animation-direction: reverse;
        }
        .holo-ring:nth-child(5) {
            width: 40%;
            height: 40%;
            border-color: rgba(0, 255, 255, 0.7);
            animation-duration: 4s;
        }
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .holo-core {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, transparent 70%);
            filter: blur(20px);
            animation: pulseCore 3s ease-in-out infinite;
        }
        @keyframes pulseCore {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        .holo-image {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .holo-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.8;
            mix-blend-mode: luminosity;
        }
        .holo-image .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            padding: 20px;
        }
        .holo-title {
            font-size: 18px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        .holo-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        .holo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.5), transparent);
            animation: scanLine 3s linear infinite;
        }
        @keyframes scanLine {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .static-noise {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04;
            animation: staticShift 0.2s steps(5) infinite;
        }
        @keyframes staticShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(10%, 10%); }
        }
        .chromatic-shift {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.1) 0%,
                rgba(0, 255, 255, 0.1) 100%
            );
            mix-blend-mode: screen;
            animation: chromatic 4s ease-in-out infinite;
        }
        @keyframes chromatic {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: gridGlitch 3s infinite;
        }
        @keyframes gridGlitch {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .controls {
            position: fixed;
            bottom: 30px;
            display: flex;
            gap: 10px;
        }
        .control-btn {
            padding: 10px 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
        }
        .active {
            background: rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
            color: #00ffff;
        }
    </style>
</head>
<body>
    <div class="holo-container">
        <div class="holo-ring"></div>
        <div class="holo-ring"></div>
        <div class="holo-ring"></div>
        <div class="holo-ring"></div>
        <div class="holo-ring"></div>
        <div class="holo-core"></div>
        <div class="holo-image">
            <div class="static-noise"></div>
            <div class="grid-overlay"></div>
            <div class="chromatic-shift"></div>
            <div class="scan-line"></div>
            <div class="holo-overlay"></div>
            <div class="content">
                <div class="holo-title">HOLOGRAM</div>
                <div class="holo-subtitle">ACTIVE TRANSMISSION</div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button class="control-btn active" id="scanBtn">SCAN MODE</button>
        <button class="control-btn active" id="distortBtn">DISTORTION</button>
    </div>
    <script>
        const scanLine = document.querySelector('.scan-line');
        const staticNoise = document.querySelector('.static-noise');
        const chromaticShift = document.querySelector('.chromatic-shift');
        const scanBtn = document.getElementById('scanBtn');
        const distortBtn = document.getElementById('distortBtn');
        const rings = document.querySelectorAll('.holo-ring');
        let scanEnabled = true;
        let distortEnabled = true;
        scanBtn.addEventListener('click', () => {
            scanEnabled = !scanEnabled;
            scanLine.style.display = scanEnabled ? 'block' : 'none';
            scanBtn.classList.toggle('active', scanEnabled);
        });
        distortBtn.addEventListener('click', () => {
            distortEnabled = !distortEnabled;
            staticNoise.style.display = distortEnabled ? 'block' : 'none';
            chromaticShift.style.display = distortEnabled ? 'block' : 'none';
            distortBtn.classList.toggle('active', distortEnabled);
        });
        rings.forEach((ring, i) => {
            ring.addEventListener('mouseover', () => {
                ring.style.borderColor = 'rgba(0, 255, 255, 0.9)';
                ring.style.boxShadow = '0 0 20px rgba(0, 255, 255, 0.5)';
            });
            ring.addEventListener('mouseout', () => {
                ring.style.borderColor = '';
                ring.style.boxShadow = '';
            });
        });
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            rings.forEach((ring, i) => {
                const offsetX = (x - 0.5) * 20;
                const offsetY = (y - 0.5) * 20;
                ring.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${Date.now() / 1000 * (i % 2 ? 1 : -1)}deg)`;
            });
        });
    </script>
</body>
</html>
