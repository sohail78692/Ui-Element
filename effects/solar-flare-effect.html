<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Solar Flare Effect UI Component">
<title>Solar Flare Effect</title>
<style>
body {
    background: #050508;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.solar-container {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.solar-core {
    position: absolute;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, #fff 0%, #ffd700 40%, #ff8c00 70%, transparent 100%);
    border-radius: 50%;
    animation: solarPulse 2s ease-in-out infinite;
}
.solar-flare {
    position: absolute;
    width: 200px;
    height: 200px;
    background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.4), transparent, rgba(255, 140, 0, 0.3), transparent);
    border-radius: 50%;
    animation: flareSpin 8s linear infinite;
    opacity: 0.6;
}
.solar-flare:nth-child(3) {
    width: 280px;
    height: 280px;
    animation-duration: 12s;
    animation-direction: reverse;
    opacity: 0.4;
}
@keyframes solarPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }
    50% { transform: scale(1.15); box-shadow: 0 0 80px rgba(255, 215, 0, 0.9); }
}
@keyframes flareSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="solar-container">
    <span class="solar-flare"></span>
    <span class="solar-flare"></span>
    <span class="solar-core"></span>
</div>

</body>
</html>
