<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Authentication Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020205;
            font-family: 'Rajdhani', sans-serif;
            padding: 20px;
        }
        .quantum-container {
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            background: linear-gradient(180deg, rgba(15,15,30,0.95) 0%, rgba(8,8,16,0.98) 100%);
            border-radius: 16px;
            border: 1px solid rgba(138, 100, 255, 0.2);
            box-shadow: 
                0 0 60px rgba(138, 100, 255, 0.08),
                inset 0 0 60px rgba(138, 100, 255, 0.03);
            position: relative;
            overflow: hidden;
        }
        .quantum-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 16px;
        }
        .quantum-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #8a64ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #8a64ff, 0 0 20px #8a64ff;
            animation: quantumFloat 8s infinite linear;
        }
        @keyframes quantumFloat {
            0% { transform: translateY(100%) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100%) rotate(360deg); opacity: 0; }
        }
        .form-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }
        .quantum-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #8a64ff;
            text-shadow: 0 0 30px rgba(138, 100, 255, 0.6);
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        .quantum-subtitle {
            font-size: 13px;
            color: rgba(138, 100, 255, 0.5);
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            padding-left: 4px;
        }
        .quantum-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(138, 100, 255, 0.25);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        .quantum-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        .quantum-input:focus {
            border-color: #8a64ff;
            background: rgba(138, 100, 255, 0.05);
            box-shadow: 
                0 0 0 3px rgba(138, 100, 255, 0.1),
                0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .quantum-input.error {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.03);
        }
        .error-message {
            font-size: 12px;
            color: #ff4444;
            margin-top: 6px;
            padding-left: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .quantum-input.error + .error-message {
            opacity: 1;
        }
        .quantum-actions {
            display: flex;
            gap: 12px;
            margin-top: 35px;
            position: relative;
            z-index: 2;
        }
        .quantum-btn {
            flex: 1;
            padding: 16px 24px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .quantum-btn.primary {
            background: linear-gradient(135deg, #8a64ff, #6a4fff);
            color: #fff;
            border: none;
        }
        .quantum-btn.primary:hover {
            box-shadow: 0 0 40px rgba(138, 100, 255, 0.5);
            transform: translateY(-2px);
        }
        .quantum-btn.secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .quantum-btn.secondary:hover {
            border-color: #8a64ff;
            color: #8a64ff;
        }
        .quantum-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }
        .quantum-btn:active::before {
            width: 200px;
            height: 200px;
        }
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            position: relative;
            z-index: 2;
        }
        .shield-icon {
            width: 14px;
            height: 14px;
            fill: #8a64ff;
        }
        .quantum-ring {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px dashed rgba(138, 100, 255, 0.1);
            border-radius: 50%;
            top: -75px;
            right: -75px;
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <form class="quantum-container" id="quantumForm">
        <div class="quantum-field" id="quantumField"></div>
        <div class="quantum-ring"></div>
        <div class="form-header">
            <h1 class="quantum-title">QUANTUM AUTH</h1>
            <p class="quantum-subtitle">SECURE NEURAL IDENTIFICATION</p>
        </div>
        <div class="form-group">
            <label class="form-label">Quantum ID</label>
            <input type="text" class="quantum-input" placeholder="Enter your quantum identifier" required>
        </div>
        <div class="form-group">
            <label class="form-label">Access Key</label>
            <input type="password" class="quantum-input" placeholder="Enter access key" required>
        </div>
        <div class="form-group">
            <label class="form-label">Secondary Verification</label>
            <input type="text" class="quantum-input" placeholder="2FA code">
            <span class="error-message">Invalid verification code</span>
        </div>
        <div class="quantum-actions">
            <button type="submit" class="quantum-btn primary">Authenticate</button>
            <button type="button" class="quantum-btn secondary">Cancel</button>
        </div>
        <div class="security-badge">
            <svg class="shield-icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            <span>256-Bit Quantum Encryption</span>
        </div>
    </form>
    <script>
        const form = document.getElementById('quantumForm');
        const field = document.getElementById('quantumField');
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'quantum-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (5 + Math.random() * 5) + 's';
                field.appendChild(particle);
            }
        }
        createParticles();
        form.querySelectorAll('.quantum-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.error-message').style.opacity = '0';
                if (input.classList.contains('error')) {
                    input.classList.remove('error');
                }
            });
        });
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputs = form.querySelectorAll('.quantum-input');
            let valid = true;
            inputs.forEach((input, index) => {
                if (input.hasAttribute('required') && !input.value.trim()) {
                    input.classList.add('error');
                    valid = false;
                } else if (index === 2 && input.value && input.value.length !== 6) {
                    input.classList.add('error');
                    valid = false;
                } else {
                    input.classList.remove('error');
                }
            });
            if (valid) {
                alert('Quantum authentication successful!');
                form.reset();
            }
        });
    </script>
</body>
</html>
